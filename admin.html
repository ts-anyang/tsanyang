
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TS 안양자동차검사소 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --blue:#1456a1;
  --line:#dce5f0;
  --bg:#f3f6fb;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:#25354a;
  font-family:system-ui,'Malgun Gothic',sans-serif;
}
header {
  background:white;
  border-bottom:1px solid var(--line);
  text-align:center;
  padding:20px 12px;
}
header h1 {font-size:20px;margin:0;color:var(--blue)}
header p {font-size:12px;color:#64748b}
main {max-width:600px;margin:22px auto;padding:0 14px}
.card {
  background:white;
  border-radius:15px;
  padding:21px;
  margin-bottom:15px;
  border:1px solid var(--line);
}
h2 {font-size:19px;margin:0 0 16px}
h3 {font-size:15px;margin:18px 0 10px}
label {
  display:block;
  font-size:14px;
  font-weight:700;
  margin:16px 0 8px;
}
input:not([type=checkbox]),textarea {
  width:100%;
  font:inherit;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:9px;
}
textarea {min-height:115px;resize:vertical;line-height:1.6}
button {
  cursor:pointer;
  border:0;
  border-radius:9px;
  font:inherit;
  font-weight:700;
}
button:disabled {opacity:.55;cursor:wait}
.action {
  display:block;
  background:var(--blue);
  color:white;
  width:100%;
  padding:14px;
  margin-top:16px;
}
.secondary {background:#eaf2fb;color:var(--blue)}
.hidden {display:none!important}
.hint {font-size:13px;color:#64748b;line-height:1.6}
.tabs {display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tab {
  background:white;
  border:1px solid var(--line);
  padding:15px 5px;
  display:flex;
  align-items:center;
  flex-direction:column;
  gap:6px;
  color:#52657a;
}
.tab.active {
  background:#eaf3ff;
  border-color:var(--blue);
  color:var(--blue);
}
.tabIcon {font-size:25px}
.tabName {font-size:12px;text-align:center}
.options {
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px;
  background:#f8faff;
  margin-top:12px;
}
.option {
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:8px 0;
  font-size:13px;
  font-weight:400;
  margin:0;
  line-height:1.5;
}
.option input {
  width:18px;
  height:18px;
  margin:2px 0 0;
  flex-shrink:0;
}
.status {
  font-size:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.7;
}
.entry {
  padding:15px 0;
  border-bottom:1px solid var(--line);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:14px;
}
.entry small {
  display:block;
  color:#64748b;
  margin-bottom:8px;
}
</style>
</head>
<body>
<header>
  <h1>TS 한국교통안전공단</h1>
  <p>안양자동차검사소 · 하체사진 관리자</p>
</header>

<main>
<section class="card" id="loginSection">
  <h2>관리자 로그인</h2>
  <label for="email">이메일</label>
  <input id="email" type="email">
  <label for="password">비밀번호</label>
  <input id="password" type="password">
  <button class="action" id="loginBtn">로그인</button>
</section>

<div id="adminPanel" class="hidden">

  <nav class="tabs" aria-label="관리자 메뉴">
    <button class="tab active" data-tab="uploadSection">
      <span class="tabIcon">📷</span>
      <span class="tabName">사진 및 소견<br>등록</span>
    </button>
    <button class="tab" data-tab="editSection">
      <span class="tabIcon">📝</span>
      <span class="tabName">점검 소견<br>수정</span>
    </button>
    <button class="tab" data-tab="feedbackSection">
      <span class="tabIcon">💬</span>
      <span class="tabName">고객 피드백<br>확인</span>
    </button>
  </nav>

  <!-- 첫 번째 메뉴 -->
  <section class="card" id="uploadSection">
    <h2>사진 및 점검 소견 등록</h2>
    <p class="hint">
      차량번호, 사진, 점검 소견을 등록합니다.
    </p>

    <label for="plate">차량번호</label>
    <input id="plate" placeholder="예) 123가4567">

    <label for="photos">하체사진 (1~7장)</label>
    <input id="photos" type="file"
      accept="image/jpeg,image/png,image/webp" multiple>
    <p class="hint" id="fileCount">선택된 사진: 0장</p>

    <h3>검사소 점검 소견</h3>
    <p class="hint">
      실제 확인한 항목을 여러 개 선택할 수 있습니다.
    </p>
    <div id="uploadOptions" class="options"></div>

    <label for="comment">직접 작성 및 수정</label>
    <textarea id="comment" maxlength="1000"
      placeholder="점검 소견을 직접 작성하거나 선택 문구를 추가하세요."></textarea>

    <button class="action" id="uploadBtn">
      사진 및 점검 소견 등록
    </button>
  </section>

  <!-- 두 번째 메뉴 -->
  <section class="card hidden" id="editSection">
    <h2>기존 점검 소견 수정</h2>
    <p class="hint">
      차량번호로 가장 최근 등록한 소견을 불러옵니다.
    </p>

    <label for="editPlate">차량번호</label>
    <input id="editPlate" placeholder="예) 123가4567">

    <button class="action secondary" id="loadComment">
      기존 점검 소견 불러오기
    </button>

    <div id="editFields" class="hidden">
      <h3>수정할 소견 선택</h3>
      <div id="editOptions" class="options"></div>

      <label for="editComment">점검 소견 수정</label>
      <textarea id="editComment" maxlength="1000"></textarea>

      <button class="action" id="saveComment">
        변경사항 저장
      </button>
    </div>
  </section>

  <!-- 세 번째 메뉴 -->
  <section class="card hidden" id="feedbackSection">
    <h2>고객님의 한마디</h2>
    <p class="hint">
      고객이 제출한 의견을 최신순으로 표시합니다.
    </p>

    <button class="action secondary" id="refreshBtn">
      접수 내역 새로고침
    </button>

    <div id="feedbackList"></div>
  </section>

  <section class="card">
    <h2>작업 상태</h2>
    <div class="status" id="status" role="status">
      연결 확인 중...
    </div>
  </section>

  <button class="action secondary" id="logoutBtn">
    로그아웃
  </button>
</div>
</main>

<script>
const SUPABASE_URL =
  'https://qxilydmnxkhcxdybzlew.supabase.co';
const SUPABASE_KEY =
  'sb_publishable_dgOcMAwzSnNozCaHlD6qHg_hXsnNO_t';

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

const el = id => document.getElementById(id);
const report = msg => el('status').textContent = msg;
const clean = s => s.replace(/\s/g,'').trim();
const valid = s => /^\d{2,3}[가-힣]\d{4}$/.test(s);

let editId = null;

// 관리자가 선택할 수 있는 점검 문구
const templates = [
  '차량 하부 육안 확인 결과 특이사항 없음',
  '엔진 및 변속기 주변 누유 흔적 확인',
  '차량 하부 부품의 부식 흔적 확인',
  '배기계통 부식 및 손상 흔적 확인',
  '차량 하부 보호커버 손상 확인',
  '서스펜션 주변 부품 상태 확인 필요',
  '하부 일부 구간은 커버로 인해 확인 제한',
  '추가적인 정비점검 권장'
];

// 문구 선택 기능 생성
function createOptions(containerId, textareaId) {
  const box = el(containerId);

  templates.forEach(text => {
    const label = document.createElement('label');
    label.className = 'option';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = text;

    const span = document.createElement('span');
    span.textContent = text;

    label.append(cb,span);
    box.appendChild(label);
  });

  const btn = document.createElement('button');
  btn.className = 'action secondary';
  btn.textContent = '선택한 문구 추가하기';
  btn.type = 'button';

  btn.onclick = () => {
    const area = el(textareaId);

    const selected = [...box.querySelectorAll(
      'input:checked'
    )].map(cb => cb.value);

    if (!selected.length) {
      report('추가할 문구를 선택해 주세요.');
      return;
    }

    const old = area.value.trim();
    const lines = old.split('\n').map(s => s.trim());

    const additions = selected.filter(
      s => !lines.includes(s)
    );

    const result = [old,...additions]
      .filter(Boolean).join('\n');

    if (result.length > 1000) {
      report('점검 소견은 최대 1000자입니다.');
      return;
    }

    area.value = result;

    box.querySelectorAll('input').forEach(
      cb => cb.checked = false
    );

    report('선택한 문구를 입력창에 추가했습니다.');
  };

  box.appendChild(btn);
}

createOptions('uploadOptions','comment');
createOptions('editOptions','editComment');

// 관리자 메뉴 전환
document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(
      b => b.classList.remove('active')
    );
    btn.classList.add('active');

    ['uploadSection','editSection','feedbackSection']
      .forEach(id => {
        el(id).classList.toggle(
          'hidden', id !== btn.dataset.tab
        );
      });

    report('메뉴를 선택했습니다.');
  };
});

function loggedOut() {
  el('loginSection').classList.remove('hidden');
  el('adminPanel').classList.add('hidden');
}

async function verifyAdmin() {
  const {data:{user},error:authError} =
    await db.auth.getUser();

  if (authError || !user) {
    loggedOut();
    return false;
  }

  const {data,error} = await db
    .from('admin_users')
    .select('user_id')
    .eq('user_id',user.id)
    .maybeSingle();

  if (error) throw error;

  if (!data) {
    loggedOut();
    report('관리자 권한이 없습니다.');
    return false;
  }

  el('loginSection').classList.add('hidden');
  el('adminPanel').classList.remove('hidden');
  return true;
}

// 로그인
el('loginBtn').onclick = async () => {
  const btn = el('loginBtn');
  btn.disabled = true;

  try {
    const {error} = await db.auth.signInWithPassword({
      email:el('email').value.trim(),
      password:el('password').value
    });

    if (error) throw error;

    el('password').value = '';

    if (await verifyAdmin()) {
      report('관리자 로그인 완료');
    }
  } catch(e) {
    report('로그인 오류: '+e.message);
  } finally {
    btn.disabled = false;
  }
};

el('logoutBtn').onclick = async () => {
  const {error} = await db.auth.signOut();

  if (error) {
    report('로그아웃 오류: '+error.message);
    return;
  }

  loggedOut();
  report('로그아웃했습니다.');
};

el('photos').onchange = () => {
  el('fileCount').textContent =
    '선택된 사진: '+el('photos').files.length+'장';
};

// 사진 및 소견 등록
el('uploadBtn').onclick = async () => {
  const plate = clean(el('plate').value);
  const files = [...el('photos').files];
  const comment = el('comment').value.trim();

  if (!valid(plate)) {
    report('차량번호를 확인해 주세요.');
    return;
  }

  if (files.length < 1 || files.length > 7) {
    report('사진은 1~7장을 선택해 주세요.');
    return;
  }

  if (files.some(f =>
    !['image/jpeg','image/png','image/webp'].includes(f.type)
  )) {
    report('JPG, PNG, WEBP 사진만 가능합니다.');
    return;
  }

  const btn = el('uploadBtn');
  btn.disabled = true;

  try {
    if (!await verifyAdmin()) {
      throw Error('관리자 로그인이 필요합니다.');
    }

    report('차량정보 등록 중...');

    const {data:vehicle,error:ve} = await db
      .from('vehicles')
      .insert({
        plate_number:plate,
        inspection_comment:comment || null
      })
      .select('id')
      .single();

    if (ve) throw ve;

    let done = 0;

    for (let i=0;i<files.length;i++) {
      const file = files[i];

      const ext = {
        'image/jpeg':'jpg',
        'image/png':'png',
        'image/webp':'webp'
      }[file.type];

      const path =
        vehicle.id+'/'+(i+1)+'-'+crypto.randomUUID()+'.'+ext;

      report(`사진 업로드 중... ${i+1}/${files.length}`);

      const {error:ue} = await db.storage
        .from('underbody-photos')
        .upload(path,file,{
          contentType:file.type,
          upsert:false
        });

      if (ue) throw ue;

      const {error:pe} = await db
        .from('vehicle_photos')
        .insert({
          vehicle_id:vehicle.id,
          storage_path:path,
          photo_order:i+1
        });

      if (pe) throw pe;
      done++;
    }

    el('plate').value = '';
    el('photos').value = '';
    el('comment').value = '';
    el('fileCount').textContent = '선택된 사진: 0장';

    report(
      '등록 성공!\n차량번호: '+plate+
      '\n사진: '+done+'장'
    );

  } catch(e) {
    report(
      '등록 오류: '+e.message+
      '\n일부 자료가 저장됐을 수 있으므로 재등록 전 확인하세요.'
    );
  } finally {
    btn.disabled = false;
  }
};

// 기존 점검 소견 불러오기
el('loadComment').onclick = async () => {
  editId = null;
  el('editFields').classList.add('hidden');

  const plate = clean(el('editPlate').value);

  if (!valid(plate)) {
    report('차량번호를 확인해 주세요.');
    return;
  }

  try {
    if (!await verifyAdmin()) {
      throw Error('관리자 로그인이 필요합니다.');
    }

    const {data,error} = await db
      .from('vehicles')
      .select('id,inspection_comment')
      .eq('plate_number',plate)
      .order('created_at',{ascending:false})
      .limit(1);

    if (error) throw error;
    if (!data?.length) {
      throw Error('등록된 차량이 없습니다.');
    }

    editId = data[0].id;
    el('editComment').value =
      data[0].inspection_comment || '';

    el('editFields').classList.remove('hidden');
    report('기존 점검 소견을 불러왔습니다.');

  } catch(e) {
    report('조회 오류: '+e.message);
  }
};

// 점검 소견 수정 저장
el('saveComment').onclick = async () => {
  if (!editId) {
    report('먼저 차량을 조회해 주세요.');
    return;
  }

  try {
    if (!await verifyAdmin()) {
      throw Error('관리자 로그인이 필요합니다.');
    }

    const {data,error} = await db
      .from('vehicles')
      .update({
        inspection_comment:
          el('editComment').value.trim() || null
      })
      .eq('id',editId)
      .select('id');

    if (error) throw error;

    if (!data?.length) {
      throw Error('수정 권한 또는 대상 차량을 확인하세요.');
    }

    report('검사소 점검 소견 수정 완료');

  } catch(e) {
    report('저장 오류: '+e.message);
  }
};

// 고객 피드백 확인
async function refreshFeedback() {
  if (!await verifyAdmin()) {
    throw Error('관리자 로그인이 필요합니다.');
  }

  const {data,error} = await db
    .from('customer_feedback')
    .select('id,message,created_at')
    .order('created_at',{ascending:false})
    .limit(100);

  if (error) throw error;

  const box = el('feedbackList');
  box.replaceChildren();

  if (!data?.length) {
    box.textContent = '접수된 고객 의견이 없습니다.';
    return;
  }

  for (const item of data) {
    const div = document.createElement('div');
    div.className = 'entry';

    const date = document.createElement('small');
    date.textContent =
      new Date(item.created_at).toLocaleString('ko-KR');

    const msg = document.createElement('div');
    msg.textContent = item.message;

    div.append(date,msg);
    box.appendChild(div);
  }
}

el('refreshBtn').onclick = async () => {
  try {
    await refreshFeedback();
    report('고객 의견을 불러왔습니다.');
  } catch(e) {
    report('의견 조회 오류: '+e.message);
  }
};

// 초기 로그인 상태 확인
(async () => {
  try {
    const ok = await verifyAdmin();
    report(
      ok ? '관리자 로그인 완료' :
      '관리자 로그인이 필요합니다.'
    );
  } catch(e) {
    loggedOut();
    report('연결 오류: '+e.message);
  }
})();
</script>
</body>
</html>
