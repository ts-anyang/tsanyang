<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TS 안양자동차검사소 | 관리자</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f7fb;
      color: #1c3049;
      font-family: system-ui, 'Malgun Gothic', sans-serif;
    }
    header {
      background: white;
      border-bottom: 1px solid #dfe7f0;
      padding: 20px;
      text-align: center;
      color: #0759ba;
      font-weight: 800;
    }
    main { max-width: 560px; margin: 24px auto; padding: 0 14px; }
    .card {
      background: white;
      border: 1px solid #e1e7ef;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 15px;
      box-shadow: 0 4px 18px #18345609;
    }
    h2 { font-size: 18px; }
    label { display: block; font-weight: 700; margin: 14px 0 7px; }
    input, textarea {
      width: 100%;
      border: 1px solid #c9d4e2;
      border-radius: 9px;
      padding: 13px;
      font: inherit;
    }
    textarea { resize: vertical; min-height: 95px; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 13px;
      background: #0759ba;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .full { width: 100%; }
    .secondary { background: #eaf2ff; color: #0759ba; }
    .hidden { display: none !important; }
    .muted, small { color: #65758b; }
    .muted { font-size: 13px; line-height: 1.6; }
    .status, .entry { white-space: pre-wrap; overflow-wrap: anywhere; }
    .status { line-height: 1.6; font-size: 14px; }
    .entry { border-bottom: 1px solid #e2e8f0; padding: 12px 0; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 7px;
      background: white;
      color: #475569;
      border: 1px solid #dce5f0;
      border-radius: 12px;
      padding: 13px 5px;
      font-size: 23px;
      line-height: 1.3;
    }
    .tab small { font-size: 12px; color: inherit; }
    .tab.active { color: #0759ba; border-color: #0759ba; background: #eaf3ff; }
    .choice-list {
      background: #f7faff;
      border: 1px solid #dce5f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .choice-list label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 0;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
    }
    .choice-list input { width: 18px; height: 18px; flex: 0 0 18px; margin: 2px 0; }
  </style>
</head>
<body>
  <header>TS 한국교통안전공단 · 하체사진 관리자</header>

  <main>
    <section class="card" id="login">
      <h2>관리자 로그인</h2>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username">
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="full" id="loginBtn" type="button">로그인</button>
    </section>

    <div class="hidden" id="panel">
      <nav class="tabs" aria-label="관리자 메뉴">
        <button class="tab active" data-target="uploadTab" type="button">
          📷<small>사진 및 소견<br>등록</small>
        </button>
        <button class="tab" data-target="editTab" type="button">
          📝<small>소견·비밀번호<br>수정</small>
        </button>
        <button class="tab" data-target="feedbackTab" type="button">
          💬<small>고객 피드백<br>확인</small>
        </button>
      </nav>

      <section class="card" id="uploadTab">
        <h2>사진 및 점검 소견 등록</h2>
        <p class="muted">사진은 1~7장, 점검 소견은 선택사항입니다.</p>

        <label for="plate">차량번호</label>
        <input id="plate" placeholder="123가4567">

        <label for="uploadPin">조회 비밀번호 (숫자 6자리)</label>
        <input id="uploadPin" type="password" inputmode="numeric"
               maxlength="6" autocomplete="new-password">

        <label for="photos">하체사진 (1~7장)</label>
        <input id="photos" type="file" multiple accept="image/jpeg,image/png,image/webp">
        <p class="muted" id="count">선택된 사진: 0장</p>

        <label for="comment">검사소 점검 소견</label>
        <div id="uploadOptions"></div>
        <textarea id="comment" maxlength="1000"
                  placeholder="직접 작성하거나 문구를 선택하세요."></textarea>
        <button class="full" id="upload" type="button">사진 및 점검 소견 등록</button>
      </section>

      <section class="card hidden" id="editTab">
        <h2>기존 차량 소견·비밀번호 수정</h2>
        <p class="muted">같은 차량번호의 등록 건이 여러 개면 가장 최근 등록 건을 불러옵니다.</p>

        <label for="editPlate">차량번호</label>
        <input id="editPlate" placeholder="123가4567">
        <button class="full secondary" id="loadComment" type="button">차량 불러오기</button>

        <div class="hidden" id="editFields">
          <label for="editPin">조회 비밀번호 (숫자 6자리)</label>
          <input id="editPin" type="password" inputmode="numeric"
                 maxlength="6" autocomplete="new-password">
          <button class="full secondary" id="savePin" type="button">조회 비밀번호 저장</button>

          <p><strong>점검 소견 문구 선택</strong></p>
          <div id="editOptions"></div>
          <label for="editComment">점검 소견 수정</label>
          <textarea id="editComment" maxlength="1000"></textarea>
          <button class="full" id="saveComment" type="button">점검 소견 저장</button>
        </div>
      </section>

      <section class="card hidden" id="feedbackTab">
        <h2>고객님의 한마디</h2>
        <p class="muted">최근 접수된 의견 100건을 표시합니다.</p>
        <button class="full secondary" id="refresh" type="button">접수 내역 새로고침</button>
        <div id="feedbackList"></div>
      </section>

      <button class="full secondary" id="logout" type="button">로그아웃</button>
    </div>

    <section class="card">
      <h2>작업 상태</h2>
      <div class="status" id="status" role="status">연결 확인 중...</div>
    </section>
  </main>

  <script>
    const URL_BASE = 'https://qxilydmnxkhcxdybzlew.supabase.co';
    const KEY = 'sb_publishable_dgOcMAwzSnNozCaHlD6qHg_hXsnNO_t';
    const db = supabase.createClient(URL_BASE, KEY);

    const $ = id => document.getElementById(id);
    const clean = value => value.replace(/\s/g, '');
    const validPlate = value => /^\d{2,3}[가-힣]\d{4}$/.test(value);
    const validPin = value => /^[0-9]{6}$/.test(value);
    const report = message => { $('status').textContent = message; };

    let editId = null;

    const templates = [
      '차량 하부 육안 확인 결과 특이사항 없음',
      '엔진 및 변속기 주변 누유 흔적 확인',
      '차량 하부 부품의 부식 흔적 확인',
      '배기계통 부식 및 손상 흔적 확인',
      '차량 하부 보호커버 손상 확인',
      '서스펜션 주변 부품 상태 확인 필요',
      '하부 일부 구간은 커버로 인해 확인 제한',
      '추가적인 정비점검 권장'
    ];

    function makeOptions(boxId, textId) {
      const list = document.createElement('div');
      list.className = 'choice-list';

      for (const template of templates) {
        const label = document.createElement('label');
        const check = document.createElement('input');
        const span = document.createElement('span');
        check.type = 'checkbox';
        check.value = template;
        span.textContent = template;
        label.append(check, span);
        list.append(label);
      }

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'full secondary';
      button.textContent = '선택한 문구 추가하기';

      button.onclick = () => {
        const area = $(textId);
        const existing = area.value.trim();
        const lines = existing.split('\n').map(line => line.trim());
        const additions = [...list.querySelectorAll('input:checked')]
          .map(check => check.value)
          .filter(value => !lines.includes(value));

        if (!additions.length) return report('추가할 새 문구를 선택해 주세요.');

        const result = [existing, ...additions].filter(Boolean).join('\n');
        if (result.length > 1000) return report('점검 소견은 최대 1000자입니다.');

        area.value = result;
        list.querySelectorAll('input').forEach(check => { check.checked = false; });
        report('선택한 문구를 추가했습니다.');
      };

      $(boxId).append(list, button);
    }

    makeOptions('uploadOptions', 'comment');
    makeOptions('editOptions', 'editComment');

    document.querySelectorAll('.tab').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(tab => {
          tab.classList.toggle('active', tab === button);
        });
        for (const id of ['uploadTab', 'editTab', 'feedbackTab']) {
          $(id).classList.toggle('hidden', id !== button.dataset.target);
        }
      });
    });

    function resetEdit() {
      editId = null;
      $('editPin').value = '';
      $('editComment').value = '';
      $('editFields').classList.add('hidden');
      $('editOptions').querySelectorAll('input').forEach(check => {
        check.checked = false;
      });
    }

    function loggedOut() {
      resetEdit();
      $('uploadPin').value = '';
      $('login').classList.remove('hidden');
      $('panel').classList.add('hidden');
    }

    async function verify() {
      const { data, error } = await db.auth.getUser();
      if (error || !data.user) {
        loggedOut();
        return false;
      }

      const admin = await db.from('admin_users')
        .select('user_id')
        .eq('user_id', data.user.id)
        .maybeSingle();

      if (admin.error) throw admin.error;
      if (!admin.data) {
        loggedOut();
        throw Error('관리자 권한이 없습니다.');
      }

      $('login').classList.add('hidden');
      $('panel').classList.remove('hidden');
      return true;
    }

    async function requireAdmin() {
      if (!await verify()) throw Error('관리자 로그인이 필요합니다.');
    }

    async function setPin(vehicleId, pin) {
      const { error } = await db.rpc('set_vehicle_lookup_pin', {
        p_vehicle_id: vehicleId,
        p_pin: pin
      });
      if (error) throw error;
    }

    $('loginBtn').onclick = async () => {
      $('loginBtn').disabled = true;
      try {
        const { error } = await db.auth.signInWithPassword({
          email: $('email').value.trim(),
          password: $('password').value
        });
        if (error) throw error;
        $('password').value = '';
        await requireAdmin();
        report('로그인 성공');
        await loadFeedbackOnLogin();
      } catch (error) {
        report('로그인 오류: ' + error.message);
      } finally {
        $('loginBtn').disabled = false;
      }
    };

    $('logout').onclick = async () => {
      const { error } = await db.auth.signOut();
      if (error) return report('로그아웃 오류: ' + error.message);
      loggedOut();
      report('로그아웃했습니다.');
    };

    $('photos').onchange = () => {
      $('count').textContent = '선택된 사진: ' + $('photos').files.length + '장';
    };

    $('upload').onclick = async () => {
      const plate = clean($('plate').value);
      const pin = $('uploadPin').value;
      const files = [...$('photos').files];
      const comment = $('comment').value.trim();
      const extensions = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/webp': 'webp'
      };

      if (!validPlate(plate)) return report('차량번호를 확인하세요.');
      if (!validPin(pin)) return report('조회 비밀번호 숫자 6자리를 입력하세요.');
      if (files.length < 1 || files.length > 7) return report('사진을 1~7장 선택하세요.');
      if (files.some(file => !extensions[file.type])) {
        return report('JPG/PNG/WEBP만 가능합니다.');
      }

      $('upload').disabled = true;
      let created = false;
      let done = 0;
      try {
        await requireAdmin();
        report('차량 등록 중...');

        const { data: vehicle, error } = await db.from('vehicles')
          .insert({ plate_number: plate, inspection_comment: comment || null })
          .select('id')
          .single();
        if (error) throw error;
        created = true;

        try {
          await setPin(vehicle.id, pin);
        } catch (pinError) {
          report('차량은 생성됐지만 조회 비밀번호 저장에 실패했습니다. 사진 업로드 전입니다.\n'
            + pinError.message);
          return;
        }

        $('uploadPin').value = '';
        for (const [index, file] of files.entries()) {
          const path = `${vehicle.id}/${index + 1}-${crypto.randomUUID()}.${extensions[file.type]}`;
          report(`사진 업로드 중... ${index + 1}/${files.length}`);

          const upload = await db.storage.from('underbody-photos')
            .upload(path, file, { contentType: file.type, upsert: false });
          if (upload.error) throw upload.error;

          const photo = await db.from('vehicle_photos').insert({
            vehicle_id: vehicle.id,
            storage_path: path,
            photo_order: index + 1
          });
          if (photo.error) throw photo.error;
          done++;
        }

        $('plate').value = '';
        $('photos').value = '';
        $('comment').value = '';
        $('count').textContent = '선택된 사진: 0장';
        report(`등록 성공: ${plate}, 사진 ${done}장`);
      } catch (error) {
        const detail = created
          ? `\n차량 등록 건이 생성됐습니다. 사진 ${done}장 등록 완료. 재등록 전 확인하세요.`
          : '';
        report('등록 오류: ' + error.message + detail);
      } finally {
        $('upload').disabled = false;
      }
    };

    $('editPlate').addEventListener('input', resetEdit);

    $('loadComment').onclick = async () => {
      resetEdit();
      const plate = clean($('editPlate').value);
      if (!validPlate(plate)) return report('차량번호를 확인하세요.');

      $('loadComment').disabled = true;
      try {
        await requireAdmin();
        const { data, error } = await db.from('vehicles')
          .select('id,inspection_comment')
          .eq('plate_number', plate)
          .order('created_at', { ascending: false, nullsFirst: false })
          .order('id', { ascending: true })
          .limit(1);

        if (error) throw error;
        if (!data.length) throw Error('등록된 차량이 없습니다.');
        if (clean($('editPlate').value) !== plate) return;

        editId = data[0].id;
        $('editComment').value = data[0].inspection_comment || '';
        $('editFields').classList.remove('hidden');
        report(`${plate}의 최근 등록 건을 불러왔습니다.`);
      } catch (error) {
        report('조회 오류: ' + error.message);
      } finally {
        $('loadComment').disabled = false;
      }
    };

    $('savePin').onclick = async () => {
      const vehicleId = editId;
      const plate = clean($('editPlate').value);
      const pin = $('editPin').value;

      if (!vehicleId) return report('먼저 차량을 불러오세요.');
      if (!validPin(pin)) return report('조회 비밀번호 숫자 6자리를 입력하세요.');

      $('savePin').disabled = true;
      try {
        await requireAdmin();
        await setPin(vehicleId, pin);
        if (editId === vehicleId) $('editPin').value = '';
        report(`${plate} 조회 비밀번호 저장 완료`);
      } catch (error) {
        report('조회 비밀번호 저장 오류: ' + error.message);
      } finally {
        $('savePin').disabled = false;
      }
    };

    $('saveComment').onclick = async () => {
      const vehicleId = editId;
      const comment = $('editComment').value.trim();
      if (!vehicleId) return report('먼저 차량을 불러오세요.');

      $('saveComment').disabled = true;
      try {
        await requireAdmin();
        const { data, error } = await db.from('vehicles')
          .update({ inspection_comment: comment || null })
          .eq('id', vehicleId)
          .select('id');

        if (error) throw error;
        if (!data.length) throw Error('수정 권한 또는 대상 차량을 확인하세요.');
        report('점검 소견 저장 완료');
      } catch (error) {
        report('저장 오류: ' + error.message);
      } finally {
        $('saveComment').disabled = false;
      }
    };

    async function refreshFeedback() {
      const { data, error } = await db.from('customer_feedback')
        .select('id,nickname,message,created_at')
        .order('created_at', { ascending: false })
        .limit(100);
      if (error) throw error;

      const list = $('feedbackList');
      list.replaceChildren();
      if (!data.length) {
        list.textContent = '접수된 의견이 없습니다.';
        return;
      }

      for (const item of data) {
        const entry = document.createElement('div');
        const date = document.createElement('small');
        const nickname = document.createElement('strong');
        const message = document.createElement('div');

        entry.className = 'entry';
        date.textContent = new Date(item.created_at).toLocaleString('ko-KR');
        nickname.textContent = item.nickname || '익명';
        nickname.style.display = 'block';
        nickname.style.margin = '6px 0';
        message.textContent = item.message;
        entry.append(date, nickname, message);
        list.append(entry);
      }
    }

    async function loadFeedbackOnLogin() {
      try {
        await refreshFeedback();
      } catch (error) {
        report('관리자 로그인 완료. 고객 의견 조회 오류: ' + error.message);
      }
    }

    $('refresh').onclick = async () => {
      try {
        await requireAdmin();
        await refreshFeedback();
        report('최근 접수 내역을 불러왔습니다.');
      } catch (error) {
        report('의견 조회 오류: ' + error.message);
      }
    };

    verify().then(async ok => {
      if (ok) {
        report('관리자 로그인 완료');
        await loadFeedbackOnLogin();
      } else {
        report('로그인이 필요합니다.');
      }
    }).catch(error => report('연결 오류: ' + error.message));
  </script>
</body>
</html>
