<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafbff">
  <title>하체사진 조회 | TS 안양자동차검사소</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    :root {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
                   system-ui, sans-serif;
      color: #10162c;
      background: #eff3fa;
      -webkit-text-size-adjust: 100%;
    }

    body { margin: 0; }
    button, input, a { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 3px solid #3989ef;
      outline-offset: 3px;
    }

    .page {
      position: relative;
      isolation: isolate;
      width: min(100%, 460px);
      min-height: 100vh;
      min-height: 100svh;
      margin: auto;
      overflow: hidden;
      background: linear-gradient(145deg, #fff 12%, #fbfcff 54%, #f7f9fd);
      container-type: inline-size;
    }

    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .wave { position: absolute; z-index: -1; pointer-events: none; }
    .wave-top { width: 62%; height: auto; right: 0; top: 0; }
    .wave-bottom { width: 100%; height: auto; bottom: 0; left: 0; }
    .page.is-result .wave-top { width: 44%; }
    .page.is-result .warm-top { display: none; }

    /* 以 시안의 휴대폰 테두리와 상태표시줄을 제외한 화면 비율 */
    .home {
      width: 86.5%;
      margin: auto;
      padding: clamp(32px, 12cqw, 55px) 0 clamp(88px, 24cqw, 110px);
    }

    .brand {
      display: block;
      width: 70%;
      height: auto;
      margin-left: 1%;
      mix-blend-mode: multiply;
    }

    .intro { text-align: center; margin-top: 9cqw; }
    .car-art {
      display: block;
      width: 27cqw;
      height: 27cqw;
      margin: auto;
      border-radius: 50%;
      overflow: hidden;
      mix-blend-mode: multiply;
    }

    h1, h2, p { margin: 0; }
    h1 {
      margin-top: 2.5cqw;
      font-size: clamp(29px, 8.8cqw, 40px);
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -.065em;
    }

    .description {
      margin-top: 3.3cqw;
      font-size: clamp(15px, 4.55cqw, 20px);
      line-height: 1.48;
      letter-spacing: -.045em;
      color: #303546;
      word-break: keep-all;
    }

    form { margin-top: 8.4cqw; }
    .field { margin: 0 2.7%; }
    label {
      display: block;
      margin-bottom: 1.7cqw;
      font-size: clamp(17px, 5.1cqw, 23px);
      font-weight: 750;
      letter-spacing: -.05em;
    }

    input {
      width: 100%;
      min-height: 48px;
      height: 13.5cqw;
      padding: 0 5cqw;
      border: 1.4px solid #bdc1cb;
      border-radius: 11px;
      color: #10162c;
      background: rgba(255,255,255,.7);
      font-size: clamp(17px, 4.85cqw, 22px);
    }
    input::placeholder { color: #92959c; opacity: 1; }

    .primary, .feedback-link {
      display: flex;
      align-items: center;
      width: 100%;
      border-radius: 14px;
      font-weight: 750;
      letter-spacing: -.045em;
      text-decoration: none;
    }

    .primary {
      justify-content: center;
      gap: 3.5cqw;
      min-height: 50px;
      height: 15.5cqw;
      border: 0;
      background: linear-gradient(153deg, #006ded 0%, #0054cb 52%, #0645ae 100%);
      color: white;
      box-shadow: 0 2px 5px #00449612;
      font-size: clamp(19px, 5.6cqw, 25px);
    }
    form .primary { margin-top: 5.8cqw; }

    .icon {
      width: 1.3em;
      height: 1.3em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    .feedback-link, .panel {
      border: 1px solid #d9dde6;
      background: linear-gradient(170deg, #fff 25%, #f8f9fd);
      box-shadow: 0 3px 9px #253c6810;
    }

    .feedback-link {
      gap: 4.2cqw;
      margin-top: 7.7cqw;
      padding: 0 5.4cqw;
      min-height: 56px;
      height: 17.7cqw;
      color: #151b30;
      font-size: clamp(17px, 4.9cqw, 22px);
    }
    .feedback-link .bubble { color: #0867d8; width: 1.75em; height: 1.75em; }
    .feedback-link .arrow { margin-left: auto; width: .95em; }

    .notice {
      margin-top: 12px;
      line-height: 1.5;
      text-align: center;
      font-size: 15px;
      color: #36445d;
    }
    .notice:empty { display: none; }

    /* 조회 결과 화면 */
    .result { width: 92.5%; margin: auto; padding: 5cqw 0 17cqw; }
    .back {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #10162c;
      font-size: 22px;
    }
    .result h2 {
      margin: 1cqw 0 4.5cqw;
      text-align: center;
      font-size: clamp(23px, 6.5cqw, 30px);
      letter-spacing: -.06em;
    }

    .plate-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4.8cqw;
      margin: 0 1% 5cqw;
      min-height: 52px;
      height: 15.3cqw;
      border-radius: 14px;
    }
    .plate-panel .icon { color: #0969d9; width: 9cqw; height: 9cqw; }
    .plate-panel strong {
      padding-left: 4.8cqw;
      border-left: 1px solid #bfc4d0;
      font-size: clamp(21px, 6.2cqw, 28px);
      line-height: 1.1;
    }

    .photo-frame {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1.72;
      border-radius: 16px;
      background: #15191c;
    }
    #mainPhoto { display: block; width: 100%; height: 100%; object-fit: contain; }
    .photo-nav {
      display: grid;
      place-items: center;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #fffffff0;
      color: #10162c;
      box-shadow: 0 2px 6px #0002;
    }
    #prev { left: 3%; }
    #next { right: 3%; }

    .thumbs {
      display: flex;
      gap: 2cqw;
      padding: 3cqw 1%;
      overflow-x: auto;
    }
    .thumbs button {
      flex: 0 0 calc((100% - 6cqw) / 4);
      aspect-ratio: 1.23;
      padding: 2px;
      border: 2px solid transparent;
      border-radius: 11px;
      background: transparent;
      overflow: hidden;
    }
    .thumbs button[aria-pressed="true"] { border-color: #006bed; }
    .thumbs img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    #save { width: 98%; height: 14.5cqw; margin: 2.7cqw auto 0; font-size: clamp(17px, 5.1cqw, 23px); }

    .opinion {
      display: flex;
      align-items: flex-start;
      gap: 4cqw;
      margin: 4.5cqw 1% 0;
      padding: 4.6cqw 5.8cqw;
      border-radius: 17px;
    }
    .opinion .icon { color: #0869da; width: 7.5cqw; height: 7.5cqw; }
    .opinion h3 { margin: 0 0 2.5cqw; font-size: clamp(18px, 5.1cqw, 23px); }
    #comment { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
  </style>
</head>

<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="7.6"/>
      <path d="m16.3 16.3 5 5"/>
    </symbol>
    <symbol id="i-chat" viewBox="0 0 24 24">
      <path d="M21.4 11.6c0 5-4.3 8.8-9.6 8.8-1.5 0-3-.3-4.3-.9l-4.7 1.3 1.4-4.1a8 8 0 0 1-2-5.1c0-4.9 4.3-8.7 9.6-8.7s9.6 3.8 9.6 8.7Z"/>
    </symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-car" viewBox="0 0 32 32">
      <path d="m5 13 3-7a3 3 0 0 1 2.7-1.6h10.6A3 3 0 0 1 24 6l3 7M4 13h24M5 13l-1 4v8h24v-8l-1-4M5 25v2h3v-2m16 0v2h3v-2M13 19h6"/>
      <circle cx="8.3" cy="18.8" r="1"/><circle cx="23.7" cy="18.8" r="1"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 3v12m-5-5 5 5 5-5M3 16v5h18v-5"/>
    </symbol>
    <symbol id="i-note" viewBox="0 0 24 24">
      <path d="M8 4H5a1 1 0 0 0-1 1v16h16V5a1 1 0 0 0-1-1h-3"/>
      <rect x="8" y="2" width="8" height="4" rx="1"/>
      <path d="M8 11h8m-8 4h7"/>
    </symbol>
  </svg>

  <main class="page" id="page">
    <svg class="wave wave-top" viewBox="0 0 260 200" aria-hidden="true">
      <defs>
        <linearGradient id="topWarm" x1="1" y1="0" x2=".22" y2=".88" gradientUnits="objectBoundingBox">
          <stop stop-color="#ffdbab"/>
          <stop offset=".58" stop-color="#fff0dc"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="topBlue" x1="1" y1="0" x2=".45" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#b1d7fc"/>
          <stop offset=".58" stop-color="#e1eeff"/>
          <stop offset="1" stop-color="#f5f9ff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path class="warm-top" d="M260 0C180 0 153 23 103 50S38 93 0 103V143H260Z" fill="url(#topWarm)"/>
      <path d="M260 65C198 81 148 105 112 133S67 171 36 186H260Z" fill="url(#topBlue)"/>
    </svg>

    <svg class="wave wave-bottom" viewBox="0 0 420 82" aria-hidden="true">
      <defs>
        <linearGradient id="bottomWarm">
          <stop stop-color="#ffdaab"/><stop offset="1" stop-color="#fff7eb"/>
        </linearGradient>
        <linearGradient id="bottomBlue" x1="0" y1="1" x2="1" y2=".25" gradientUnits="objectBoundingBox">
          <stop stop-color="#e5f0fc"/><stop offset=".6" stop-color="#a7d3fc"/>
          <stop offset="1" stop-color="#7fbef7"/>
        </linearGradient>
      </defs>
      <path d="M0 4C65 28 111 52 211 53S352 52 420 67V82H0Z" fill="url(#bottomWarm)"/>
      <path d="M117 82C216 39 318 0 420 2V82Z" fill="url(#bottomBlue)"/>
    </svg>

    <section class="home" id="home">
      <!-- 첫 번째 시안에서 실제 로고와 기관명 영역만 표시 -->
      <svg class="brand" viewBox="338 318 260 59" role="img"
           aria-label="TS 한국교통안전공단 안양자동차검사소">
        <image href="./design03.jpg" width="1536" height="1152"/>
      </svg>

      <div class="intro">
        <!-- 자동차와 연파란 원을 시안 원본에서 그대로 표시 -->
        <svg class="car-art" viewBox="460 413 116 115" aria-hidden="true">
          <image href="./design03.jpg" width="1536" height="1152"/>
        </svg>
        <h1>하체사진 조회</h1>
        <p class="description">
          안양자동차검사소에서 검사 시 촬영한<br>
          차량의 하체사진을 확인하세요.
        </p>
      </div>

      <form id="lookup">
        <div class="field">
          <label for="plate">차량번호</label>
          <input id="plate" placeholder="예) 123가 4567" maxlength="14"
                 autocomplete="off" enterkeyhint="search" required>
        </div>
        <button class="primary" id="search" type="submit">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <span id="searchLabel">조회하기</span>
        </button>
        <p class="notice" id="status" role="status"></p>
      </form>

      <a class="feedback-link" href="./feedback.html">
        <svg class="icon bubble" aria-hidden="true"><use href="#i-chat"/></svg>
        <span>고객님의 한마디</span>
        <svg class="icon arrow" aria-hidden="true"><use href="#i-right"/></svg>
      </a>
    </section>

    <section class="result" id="result" hidden>
      <button class="back" id="back" type="button" aria-label="조회 화면으로 돌아가기">
        <svg class="icon" aria-hidden="true"><use href="#i-left"/></svg>
      </button>

      <h2 id="resultTitle" tabindex="-1">하체사진 조회 결과</h2>

      <div class="panel plate-panel">
        <svg class="icon" aria-hidden="true"><use href="#i-car"/></svg>
        <strong id="vehicle"></strong>
      </div>

      <div class="photo-frame">
        <img id="mainPhoto" alt="차량 하체사진">
        <button class="photo-nav" id="prev" type="button" aria-label="이전 사진">
          <svg class="icon" aria-hidden="true"><use href="#i-left"/></svg>
        </button>
        <button class="photo-nav" id="next" type="button" aria-label="다음 사진">
          <svg class="icon" aria-hidden="true"><use href="#i-right"/></svg>
        </button>
      </div>

      <div class="thumbs" id="thumbs" aria-label="하체사진 선택"></div>

      <button class="primary" id="save" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
        현재 사진 저장하기
      </button>

      <div class="panel opinion" id="opinion" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-note"/></svg>
        <div>
          <h3>검사소 점검 소견</h3>
          <p id="comment"></p>
        </div>
      </div>
      <p class="notice" id="photoNotice" role="status"></p>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const $ = id => document.getElementById(id);
      const db = window.supabase?.createClient(
        "https://qxilydmnxkhcxdybzlew.supabase.co",
        "sb_publishable_dgOcMAwzSnNozCaHlD6qHg_hXsnNO_t"
      );

      let photos = [];
      let current = 0;
      let currentPlate = "";

      function clearPhotos() {
        $("mainPhoto").removeAttribute("src");
        $("thumbs").replaceChildren();
        for (const photo of photos) URL.revokeObjectURL(photo.url);
        photos = [];
        current = 0;
        $("photoNotice").textContent = "";
      }

      function showPhoto(index) {
        if (!photos.length) return;
        current = (index + photos.length) % photos.length;
        $("mainPhoto").src = photos[current].url;
        $("mainPhoto").alt = `차량 하체사진 ${current + 1} / ${photos.length}`;

        Array.from($("thumbs").children).forEach((button, i) => {
          button.setAttribute("aria-pressed", String(i === current));
        });
        const strip = $("thumbs");
        const selected = strip.children[current];
        if (selected) {
          const rect = selected.getBoundingClientRect();
          const bounds = strip.getBoundingClientRect();
          if (rect.left < bounds.left) strip.scrollLeft += rect.left - bounds.left;
          if (rect.right > bounds.right) strip.scrollLeft += rect.right - bounds.right;
        }
      }

      function openResult(plate, comment) {
        currentPlate = plate;
        $("vehicle").textContent = plate.replace(/(\d{4})$/, " $1");
        $("comment").textContent = comment;
        $("opinion").hidden = !comment;

        photos.forEach((photo, i) => {
          const button = document.createElement("button");
          button.type = "button";
          button.setAttribute("aria-label", `${i + 1}번째 하체사진 보기`);
          const img = document.createElement("img");
          img.src = photo.url;
          img.alt = "";
          button.append(img);
          button.addEventListener("click", () => showPhoto(i));
          $("thumbs").append(button);
        });

        $("prev").hidden = $("next").hidden = photos.length < 2;
        $("home").hidden = true;
        $("result").hidden = false;
        $("page").classList.add("is-result");
        showPhoto(0);
        window.scrollTo(0, 0);
        $("resultTitle").focus({preventScroll: true});
      }

      $("lookup").addEventListener("submit", async event => {
        event.preventDefault();
        if ($("search").disabled) return;

        const plate = $("plate").value.replace(/\s+/g, "");
        if (!/^\d{2,3}[가-힣]\d{4}$/.test(plate)) {
          $("status").textContent = "차량번호를 확인해 주세요. 예) 123가 4567";
          $("plate").focus();
          return;
        }
        if (!db) {
          $("status").textContent = "조회 서비스에 연결하지 못했습니다. 새로고침 후 다시 시도해 주세요.";
          return;
        }

        clearPhotos();
        $("search").disabled = true;
        $("searchLabel").textContent = "조회 중…";
        $("status").textContent = "";

        try {
          const { data: vehicle, error: vehicleError } = await db
            .from("vehicles")
            .select("id, inspection_comment")
            .eq("plate_number", plate)
            .gt("expires_at", new Date().toISOString())
            .order("created_at", { ascending: false })
            .limit(1)
            .maybeSingle();

          if (vehicleError) throw vehicleError;
          if (!vehicle) {
            $("status").textContent = "해당 차량번호로 조회 가능한 사진이 없습니다.";
            return;
          }

          const { data: rows, error: listError } = await db
            .from("vehicle_photos")
            .select("storage_path, photo_order")
            .eq("vehicle_id", vehicle.id)
            .order("photo_order", { ascending: true });

          if (listError) throw listError;
          if (!rows?.length) {
            $("status").textContent = "이 차량에 등록된 하체사진이 없습니다.";
            return;
          }

          for (const row of rows) {
            const { data, error } = await db.storage
              .from("underbody-photos")
              .download(row.storage_path);

            if (error || !data) continue;
            photos.push({
              url: URL.createObjectURL(data),
              type: data.type,
              path: row.storage_path,
              order: row.photo_order
            });
          }

          if (!photos.length) {
            $("status").textContent = "차량은 조회됐지만 사진을 불러오지 못했습니다.";
            return;
          }

          if (photos.length < rows.length) {
            $("photoNotice").textContent =
              `등록된 사진 ${rows.length}장 중 ${photos.length}장을 불러왔습니다.`;
          }
          openResult(plate, (vehicle.inspection_comment || "").trim());
        } catch (error) {
          clearPhotos();
          console.error("하체사진 조회 오류", error);
          $("status").textContent = "사진 조회 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
        } finally {
          $("search").disabled = false;
          $("searchLabel").textContent = "조회하기";
        }
      });

      $("prev").addEventListener("click", () => showPhoto(current - 1));
      $("next").addEventListener("click", () => showPhoto(current + 1));

      $("back").addEventListener("click", () => {
        clearPhotos();
        $("result").hidden = true;
        $("home").hidden = false;
        $("page").classList.remove("is-result");
        $("status").textContent = "";
        window.scrollTo(0, 0);
        $("plate").focus({preventScroll: true});
      });

      $("save").addEventListener("click", () => {
        const photo = photos[current];
        if (!photo) return;

        const extension = {
          "image/jpeg": "jpg",
          "image/png": "png",
          "image/webp": "webp",
          "image/heic": "heic"
        }[photo.type] || photo.path.match(/\.([a-z0-9]{2,5})$/i)?.[1] || "jpg";

        const link = document.createElement("a");
        link.href = photo.url;
        link.download = `${currentPlate}_하체사진_${photo.order}.${extension}`;
        document.body.append(link);
        link.click();
        link.remove();
      });
    });
  </script>
</body>
</html>
