<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7faff">
  <title>하체사진 조회 | TS 안양자동차검사소</title>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: #eff3fa;
      color: #172137;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }

    main {
      width: min(100%, 460px);
      min-height: 100vh;
      min-height: 100svh;
      margin: auto;
      padding: 30px 20px 48px;
      background:
        radial-gradient(ellipse at top right, #e0efff, transparent 36%),
        linear-gradient(155deg, white 50%, #f5f9ff);
    }

    h1, h2, h3, p { margin: 0; }
    button, input, a { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 3px solid #3989ef; outline-offset: 3px; }

    .brand, .car-art {
      background-image: url("./design03.jpg?v=5");
      background-repeat: no-repeat;
      mix-blend-mode: multiply;
    }

    .brand {
      width: 69%;
      aspect-ratio: 260 / 59;
      background-size: 590.769% auto;
      background-position: 26.489% 29.094%;
    }

    .car-art {
      width: 86px;
      aspect-ratio: 116 / 115;
      margin: 22px auto 8px;
      border-radius: 50%;
      background-size: 1324.138% auto;
      background-position: 32.394% 39.826%;
    }

    .intro { text-align: center; }
    h1 { font-size: 31px; letter-spacing: -.06em; }
    .intro p { margin-top: 8px; line-height: 1.55; color: #455168; }
    form { margin-top: 26px; }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: 750;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 10px 14px;
      border: 1px solid #adb9cb;
      border-radius: 11px;
      background: white;
      color: #172137;
      font-size: 17px;
    }

    button, .feedback {
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      font-weight: 700;
    }

    .primary {
      width: 100%;
      min-height: 51px;
      margin-top: 18px;
      background: #0759c7;
      color: white;
    }

    .secondary { background: #e8f0fb; color: #174779; }

    .captcha-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
    }

    .captcha-box {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 56px;
      overflow: hidden;
      border: 1px solid #cbd4e1;
      border-radius: 9px;
      background: white;
    }

    .captcha-box img {
      display: block;
      max-width: 100%;
      height: 54px;
      object-fit: contain;
    }

    .status {
      margin-top: 12px;
      line-height: 1.55;
      color: #404e66;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .status:empty { display: none; }

    .feedback {
      display: block;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #d4ddea;
      background: white;
      color: #164776;
      text-align: center;
      text-decoration: none;
    }

    #result h2 { margin: 17px 0; text-align: center; }
    .plate {
      margin: 0 0 14px;
      padding: 14px;
      border: 1px solid #d6dfeb;
      border-radius: 12px;
      background: white;
      text-align: center;
      font-size: 23px;
      font-weight: 750;
    }

    .frame {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: #171b22;
    }

    #openPhoto {
      display: block;
      width: 100%;
      padding: 0;
      background: transparent;
      cursor: zoom-in;
    }

    #mainPhoto {
      display: block;
      width: 100%;
      aspect-ratio: 1.55;
      object-fit: contain;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      background: #fffffff0;
      font-size: 23px;
    }

    #prev { left: 8px; }
    #next { right: 8px; }
    .hint { margin: 8px 0; text-align: center; font-size: 13px; color: #52617a; }

    #thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 4px; }
    #thumbs button {
      flex: 0 0 72px;
      height: 56px;
      padding: 2px;
      background: white;
      border: 2px solid transparent;
    }

    #thumbs button[aria-pressed="true"] { border-color: #0768dc; }
    #thumbs img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }

    .panel {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #d6dfeb;
      border-radius: 12px;
      background: white;
    }

    #comment { margin-top: 8px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }

    dialog {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: none;
      height: 100%;
      height: 100dvh;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: #101318;
      color: white;
    }

    dialog::backdrop { background: #101318; }
    .viewer-layout { display: flex; flex-direction: column; height: 100%; }
    .viewer-bar, .tools {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px;
    }

    .viewer-bar { justify-content: space-between; }
    .tools { justify-content: center; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    dialog button { min-height: 42px; background: #293445; color: white; }

    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    #zoomPhoto {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: none;
      pointer-events: none;
      transform-origin: center;
    }
  </style>
</head>

<body>
  <main>
    <section id="home">
      <div class="brand" role="img" aria-label="TS 한국교통안전공단 안양자동차검사소"></div>

      <div class="intro">
        <div class="car-art" aria-hidden="true"></div>
        <h1>하체사진 조회</h1>
        <p>안양자동차검사소에서 검사 시 촬영한<br>차량의 하체사진을 확인하세요.</p>
      </div>

      <form id="lookup" autocomplete="off">
        <label for="plate">차량번호</label>
        <input id="plate" placeholder="예) 123가4567" maxlength="14" required>

        <label for="pin">조회 비밀번호</label>
        <input id="pin" type="password" inputmode="numeric" maxlength="6"
               pattern="[0-9]{6}" placeholder="검사소에서 안내받은 숫자 6자리" required>

        <label for="answer">자동화 방지 코드</label>
        <div class="captcha-row">
          <div class="captcha-box">
            <img id="captchaImage" alt="아래 입력란에 입력할 자동화 방지 코드" hidden>
            <span id="captchaState" role="status">코드 준비 중</span>
          </div>
          <button class="secondary" id="renew" type="button">새 코드</button>
        </div>
        <input id="answer" placeholder="그림에 보이는 문자 입력" maxlength="12"
               autocapitalize="characters" spellcheck="false" required>

        <button class="primary" id="search" type="submit" disabled>조회하기</button>
        <p class="status" id="status" role="status"></p>
      </form>

      <a class="feedback" href="./feedback.html">고객님의 한마디</a>
    </section>

    <section id="result" hidden>
      <button class="secondary" id="back" type="button">← 조회 화면</button>
      <h2 id="resultTitle" tabindex="-1">하체사진 조회 결과</h2>
      <p class="plate" id="vehicle"></p>

      <div class="frame">
        <button id="openPhoto" type="button" aria-label="현재 사진 확대하기">
          <img id="mainPhoto" alt="차량 하체사진">
        </button>
        <button class="arrow" id="prev" type="button" aria-label="이전 사진">‹</button>
        <button class="arrow" id="next" type="button" aria-label="다음 사진">›</button>
      </div>

      <p class="hint" id="photoCount"></p>
      <div id="thumbs" aria-label="하체사진 선택"></div>
      <button class="primary" id="save" type="button">현재 사진 저장하기</button>
      <p class="status" id="photoStatus" role="status"></p>

      <section class="panel" id="opinion" hidden>
        <h3>검사소 점검 소견</h3>
        <p id="comment"></p>
      </section>

      <a class="feedback" href="./feedback.html">고객님의 한마디 작성하기</a>
    </section>
  </main>

  <dialog id="viewer" aria-labelledby="viewerTitle">
    <div class="viewer-layout">
      <div class="viewer-bar">
        <strong id="viewerTitle">하체사진 확대</strong>
        <button id="closeViewer" type="button">닫기</button>
      </div>
      <div id="stage">
        <img id="zoomPhoto" alt="확대한 차량 하체사진" draggable="false">
      </div>
      <div class="tools">
        <button id="zoomOut" type="button" aria-label="축소">−</button>
        <span id="zoomLevel">1.0배</span>
        <button id="zoomIn" type="button" aria-label="확대">＋</button>
        <button id="zoomReset" type="button">원래 크기</button>
      </div>
    </div>
  </dialog>

  <script>
    'use strict';

    const BASE = 'https://qxilydmnxkhcxdybzlew.supabase.co';
    const PUBLIC_KEY = 'sb_publishable_dgOcMAwzSnNozCaHlD6qHg_hXsnNO_t';
    const $ = id => document.getElementById(id);

    let challengeId = '';
    let issuing = false;
    let searching = false;
    let photos = [];
    let current = 0;
    let currentPlate = '';

    async function callFunction(name, body) {
      const response = await fetch(`${BASE}/functions/v1/${name}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': PUBLIC_KEY
        },
        cache: 'no-store',
        credentials: 'omit',
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const error = new Error(`HTTP ${response.status}`);
        error.status = response.status;
        throw error;
      }
      return response.json();
    }

    function updateButtons() {
      $('search').disabled = searching || issuing || !challengeId;
      $('renew').disabled = searching || issuing;
      $('search').textContent = searching ? '조회 중…' : '조회하기';
    }

    async function issueCaptcha() {
      if (issuing) return;
      issuing = true;
      challengeId = '';
      $('answer').value = '';
      $('captchaImage').hidden = true;
      $('captchaImage').removeAttribute('src');
      $('captchaState').hidden = false;
      $('captchaState').textContent = '코드 준비 중';
      updateButtons();

      try {
        const data = await callFunction('issue-lookup-captcha', {});
        if (typeof data.challenge_id !== 'string' || !data.challenge_id ||
            typeof data.image_svg !== 'string' || !data.image_svg.trim()) {
          throw new Error('코드 응답 형식 오류');
        }

        const image = $('captchaImage');
        image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data.image_svg);
        await image.decode();
        image.hidden = false;
        $('captchaState').hidden = true;
        challengeId = data.challenge_id;
      } catch (error) {
        $('captchaState').textContent = error.status === 429
          ? '잠시 후 새 코드를 눌러주세요.'
          : '코드를 불러오지 못했습니다.';
        if (!$('status').textContent) {
          $('status').textContent = error.status
            ? `자동화 방지 코드 발급 실패 (HTTP ${error.status}). 잠시 후 새 코드를 눌러주세요.`
            : '자동화 방지 코드를 표시할 수 없습니다. 새 코드를 눌러주세요.';
        }
      } finally {
        issuing = false;
        updateButtons();
      }
    }

    $('renew').addEventListener('click', () => {
      $('status').textContent = '';
      issueCaptcha();
    });

    function clearPhotos() {
      if ($('viewer').open) $('viewer').close();
      $('mainPhoto').removeAttribute('src');
      $('zoomPhoto').removeAttribute('src');
      $('thumbs').replaceChildren();
      for (const photo of photos) URL.revokeObjectURL(photo.url);
      photos = [];
      current = 0;
      currentPlate = '';
      $('vehicle').textContent = '';
      $('comment').textContent = '';
      $('opinion').hidden = true;
      $('photoStatus').textContent = '';
    }

    async function loadPhotos(urls) {
      for (const [index, value] of urls.entries()) {
        $('status').textContent = `사진을 불러오는 중입니다. ${index + 1}/${urls.length}`;
        try {
          if (typeof value !== 'string' || !value) continue;
          const url = new URL(value, BASE);
          if (url.origin !== BASE) continue;

          const response = await fetch(url, {
            cache: 'no-store',
            credentials: 'omit',
            referrerPolicy: 'no-referrer'
          });
          if (!response.ok) continue;
          const blob = await response.blob();
          if (!blob.size) continue;

          photos.push({
            url: URL.createObjectURL(blob),
            type: blob.type,
            order: index + 1
          });
        } catch {
          // 다른 사진은 계속 불러옵니다.
        }
      }
    }

    function showPhoto(index) {
      if (!photos.length) return;
      current = (index + photos.length) % photos.length;
      $('mainPhoto').src = photos[current].url;
      $('mainPhoto').alt = `차량 하체사진 ${current + 1} / ${photos.length}`;
      $('photoCount').textContent =
        `${current + 1} / ${photos.length} · 사진을 누르면 크게 볼 수 있습니다.`;

      const buttons = [...$('thumbs').children];
      buttons.forEach((button, i) => {
        button.setAttribute('aria-pressed', String(i === current));
      });
      const active = buttons[current];
      const strip = $('thumbs');
      const item = active.getBoundingClientRect();
      const area = strip.getBoundingClientRect();
      if (item.left < area.left) strip.scrollLeft += item.left - area.left;
      if (item.right > area.right) strip.scrollLeft += item.right - area.right;
    }

    function openResult(plate, comment, total) {
      currentPlate = plate;
      $('vehicle').textContent = plate.replace(/(\d{4})$/, ' $1');
      $('comment').textContent = comment;
      $('opinion').hidden = !comment;
      $('photoStatus').textContent = photos.length < total
        ? `등록된 사진 ${total}장 중 ${photos.length}장을 불러왔습니다.` : '';

      photos.forEach((photo, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-label', `${index + 1}번째 사진 보기`);
        const img = document.createElement('img');
        img.src = photo.url;
        img.alt = '';
        button.append(img);
        button.addEventListener('click', () => showPhoto(index));
        $('thumbs').append(button);
      });

      $('prev').hidden = $('next').hidden = photos.length < 2;
      $('home').hidden = true;
      $('result').hidden = false;
      showPhoto(0);
      window.scrollTo(0, 0);
      $('resultTitle').focus();
    }

    function lookupError(error) {
      if (error.status === 429) return '조회 시도가 많습니다. 잠시 후 다시 시도해 주세요.';
      if (error.status === 401) {
        return '조회가 승인되지 않았습니다. 입력 내용을 확인해 주세요. 계속되면 검사소에 문의해 주세요.';
      }
      if ([400, 403, 404, 410, 422].includes(error.status)) {
        return '차량번호·조회 비밀번호를 확인하고 새 자동화 방지 코드를 입력해 주세요.';
      }
      return '사진 조회에 실패했습니다. 잠시 후 다시 시도해 주세요.';
    }

    $('lookup').addEventListener('submit', async event => {
      event.preventDefault();
      if (searching || issuing || !challengeId) return;

      const plate = $('plate').value.replace(/\s/g, '');
      const pin = $('pin').value;
      const answer = $('answer').value.trim();

      if (!/^\d{2,3}[가-힣]\d{4}$/.test(plate)) {
        $('status').textContent = '차량번호를 확인해 주세요. 예) 123가4567';
        $('plate').focus();
        return;
      }
      if (!/^[0-9]{6}$/.test(pin)) {
        $('status').textContent = '조회 비밀번호 숫자 6자리를 입력해 주세요.';
        $('pin').focus();
        return;
      }
      if (!answer) {
        $('answer').focus();
        return;
      }

      const submittedId = challengeId;
      challengeId = '';
      searching = true;
      clearPhotos();
      updateButtons();
      $('status').textContent = '입력 내용을 확인하고 있습니다.';

      try {
        const data = await callFunction('lookup-underbody-photos', {
          plate_number: plate,
          pin: pin,
          challenge_id: submittedId,
          captcha_answer: answer
        });

        if (!Array.isArray(data.photos)) {
          $('status').textContent = '조회 결과를 확인할 수 없습니다. 입력 내용을 확인해 주세요.';
          return;
        }
        if (!data.photos.length) {
          $('status').textContent = '조회 가능한 하체사진이 없습니다.';
          return;
        }

        await loadPhotos(data.photos);
        if (!photos.length) {
          $('status').textContent = '사진을 열지 못했습니다. 새 코드로 다시 조회해 주세요.';
          return;
        }

        $('pin').value = '';
        $('answer').value = '';
        $('status').textContent = '';
        openResult(plate, String(data.inspection_comment || '').trim(), data.photos.length);
      } catch (error) {
        clearPhotos();
        $('status').textContent = lookupError(error);
      } finally {
        searching = false;
        updateButtons();
        if (!$('home').hidden) await issueCaptcha();
      }
    });

    $('prev').addEventListener('click', () => showPhoto(current - 1));
    $('next').addEventListener('click', () => showPhoto(current + 1));

    $('back').addEventListener('click', () => {
      clearPhotos();
      $('result').hidden = true;
      $('home').hidden = false;
      $('status').textContent = '';
      $('plate').focus();
      window.scrollTo(0, 0);
      issueCaptcha();
    });

    $('save').addEventListener('click', () => {
      const photo = photos[current];
      if (!photo) return;
      const extension = {
        'image/png': 'png',
        'image/webp': 'webp',
        'image/heic': 'heic',
        'image/jpeg': 'jpg'
      }[photo.type] || 'jpg';

      const link = document.createElement('a');
      link.href = photo.url;
      link.download = `${currentPlate}_하체사진_${photo.order}.${extension}`;
      document.body.append(link);
      link.click();
      link.remove();
    });

    const stage = $('stage');
    const zoomPhoto = $('zoomPhoto');
    const viewer = $('viewer');
    const pointers = new Map();
    const clamp = (value, low, high) => Math.max(low, Math.min(high, value));

    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let fitWidth = 0;
    let fitHeight = 0;

    function renderZoom() {
      const limitX = Math.max(0, (fitWidth * scale - stage.clientWidth) / 2);
      const limitY = Math.max(0, (fitHeight * scale - stage.clientHeight) / 2);
      offsetX = clamp(offsetX, -limitX, limitX);
      offsetY = clamp(offsetY, -limitY, limitY);

      zoomPhoto.style.transform =
        `translate(-50%, -50%) translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
      $('zoomLevel').textContent = scale.toFixed(1) + '배';
      $('zoomIn').disabled = scale >= 8;
      $('zoomOut').disabled = scale <= 1;
    }

    function fitZoom() {
      if (!viewer.open || !zoomPhoto.naturalWidth || !stage.clientWidth) return;
      const ratio = Math.min(
        stage.clientWidth / zoomPhoto.naturalWidth,
        stage.clientHeight / zoomPhoto.naturalHeight
      );
      fitWidth = zoomPhoto.naturalWidth * ratio;
      fitHeight = zoomPhoto.naturalHeight * ratio;
      zoomPhoto.style.width = fitWidth + 'px';
      zoomPhoto.style.height = fitHeight + 'px';
      scale = 1;
      offsetX = offsetY = 0;
      renderZoom();
    }

    function zoomAt(value, x = 0, y = 0) {
      const next = clamp(value, 1, 8);
      const ratio = next / scale;
      offsetX = x - (x - offsetX) * ratio;
      offsetY = y - (y - offsetY) * ratio;
      scale = next;
      renderZoom();
    }

    function gesture() {
      const points = [...pointers.values()].slice(0, 2);
      if (!points.length) return null;
      const [a, b = a] = points;
      const box = stage.getBoundingClientRect();
      return {
        x: (a.x + b.x) / 2 - box.left - box.width / 2,
        y: (a.y + b.y) / 2 - box.top - box.height / 2,
        distance: Math.hypot(a.x - b.x, a.y - b.y)
      };
    }

    $('openPhoto').addEventListener('click', () => {
      if (!photos[current]) return;
      $('viewerTitle').textContent = `하체사진 ${current + 1} / ${photos.length}`;
      viewer.showModal();
      document.body.style.overflow = 'hidden';
      zoomPhoto.src = photos[current].url;
      if (zoomPhoto.complete) fitZoom();
    });

    zoomPhoto.addEventListener('load', fitZoom);
    $('closeViewer').addEventListener('click', () => viewer.close());
    viewer.addEventListener('close', () => {
      document.body.style.overflow = '';
      pointers.clear();
      zoomPhoto.removeAttribute('src');
    });

    $('zoomIn').addEventListener('click', () => zoomAt(scale * 1.5));
    $('zoomOut').addEventListener('click', () => zoomAt(scale / 1.5));
    $('zoomReset').addEventListener('click', fitZoom);

    stage.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      stage.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    });

    stage.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId)) return;
      const before = gesture();
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      const after = gesture();

      const nextScale = before.distance > 0 && after.distance > 0
        ? clamp(scale * after.distance / before.distance, 1, 8) : scale;
      const ratio = nextScale / scale;
      offsetX = after.x - (before.x - offsetX) * ratio;
      offsetY = after.y - (before.y - offsetY) * ratio;
      scale = nextScale;
      renderZoom();
    });

    for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      stage.addEventListener(name, event => pointers.delete(event.pointerId));
    }

    stage.addEventListener('wheel', event => {
      event.preventDefault();
      const box = stage.getBoundingClientRect();
      zoomAt(
        scale * Math.exp(-event.deltaY * .002),
        event.clientX - box.left - box.width / 2,
        event.clientY - box.top - box.height / 2
      );
    }, { passive: false });

    new ResizeObserver(() => {
      if (viewer.open) fitZoom();
    }).observe(stage);

    issueCaptcha();
  </script>
</body>
</html>
