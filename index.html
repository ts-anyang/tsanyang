
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TS 안양자동차검사소 | 하체사진 조회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --blue:#0759ba;
  --ink:#17283e;
  --muted:#69798c;
  --line:#e5eaf0;
}
* {box-sizing:border-box}
body {
  margin:0;background:#f6f8fb;color:var(--ink);
  font-family:system-ui,-apple-system,'Noto Sans KR',Arial,sans-serif;
}
header {background:#fff;border-bottom:1px solid var(--line)}
.top {
  max-width:520px;margin:auto;display:flex;align-items:center;
  gap:10px;padding:17px 20px;
}
.logo {
  font-size:27px;letter-spacing:-3px;font-weight:900;color:#0874c9;
}
.logo:first-letter {color:#f39218}
.brand {font-size:14px;font-weight:800}
.sub {font-size:11px;color:var(--muted);margin-top:2px}
main {max-width:520px;margin:28px auto;padding:0 16px}
.card {
  background:white;border:1px solid var(--line);
  border-radius:17px;padding:25px 20px;
  box-shadow:0 8px 24px #20385b08;margin-bottom:17px;
}
.hero {text-align:center;padding:12px 0 24px}
.car {
  width:64px;height:64px;border-radius:18px;background:#eef5ff;
  display:grid;place-items:center;margin:0 auto 14px;color:var(--blue);
}
h1 {font-size:25px;margin:0 0 10px;letter-spacing:-.8px}
p {margin:0;color:var(--muted);line-height:1.65;font-size:14px}
label {font-size:14px;font-weight:750;display:block;margin-bottom:10px}
input {
  width:100%;padding:17px;border:1px solid #cad4e1;
  border-radius:9px;font-size:17px;outline:none;
}
input:focus {
  border-color:var(--blue);box-shadow:0 0 0 3px #0b62c21c;
}
button {cursor:pointer;font:inherit}
button:disabled {opacity:.55;cursor:wait}
.primary {
  width:100%;background:var(--blue);color:#fff;border:0;
  border-radius:9px;padding:17px;font-size:16px;
  font-weight:800;margin-top:13px;
}
.note {font-size:12px;color:#78879a;margin-top:14px}
.note:before {content:'ⓘ ';color:var(--blue)}
#resultCard {display:none}
.resultHead {
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:17px;
}
.resultHead h2 {margin:0;font-size:19px}
.pill {
  background:#eaf3ff;color:#0759ba;border-radius:99px;
  padding:6px 10px;font-size:12px;font-weight:800;
}
#status {
  font-size:14px;color:var(--muted);
  white-space:pre-wrap;line-height:1.6;
}
.photoFrame {
  position:relative;margin-top:17px;border-radius:12px;
  overflow:hidden;background:#e8edf3;aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;
}
.photoFrame img {width:100%;height:100%;object-fit:contain}
.arrow {
  position:absolute;top:50%;transform:translateY(-50%);
  width:39px;height:39px;border:0;border-radius:50%;
  background:#ffffffdf;color:#143b65;font-size:24px;
  display:grid;place-items:center;
}
.prev {left:9px}
.next {right:9px}
.counter {
  text-align:right;font-size:13px;color:var(--muted);margin:11px 0;
}
.thumbs {display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.thumb {
  width:65px;height:55px;flex:0 0 65px;padding:0;
  border:2px solid transparent;border-radius:8px;
  overflow:hidden;background:#e9edf3;
}
.thumb.active {border-color:var(--blue)}
.thumb img {width:100%;height:100%;object-fit:cover}
.secondary {
  width:100%;border:0;background:#edf4fc;color:#0759ba;
  padding:14px;border-radius:9px;font-weight:750;margin-top:14px;
}
.vehicle {
  font-size:14px;margin-top:6px;color:var(--ink);font-weight:750;
}
.hidden {display:none!important}
footer.page {
  text-align:center;font-size:11px;color:#8792a1;padding:7px 0 24px;
}

/* 새 기능: 고객님의 한마디 바로가기 */
.feedbackLink {
  display:flex;align-items:center;gap:14px;
  text-decoration:none;color:var(--ink);
  padding:19px 20px;
}
.feedbackIcon {
  width:47px;height:47px;flex:0 0 47px;
  background:#eef5ff;border-radius:13px;
  display:grid;place-items:center;color:var(--blue);
}
.feedbackText {flex:1}
.feedbackTitle {font-size:16px;font-weight:800}
.feedbackDesc {font-size:12px;color:var(--muted);margin-top:4px}
.chevron {color:var(--blue);font-size:24px}
.commentBox {
  margin-top:23px;padding:16px;background:#f3f7fd;
  border:1px solid #e2eaf5;border-radius:12px;
}
.commentBox h3 {font-size:16px;margin:0 0 12px}
.commentText {
  font-size:14px;line-height:1.7;white-space:pre-wrap;
  overflow-wrap:anywhere;
}
</style>
</head>

<body>
<header>
  <div class="top">
    <div class="logo">TS</div>
    <div>
      <div class="brand">안양자동차검사소</div>
      <div class="sub">한국교통안전공단 · 하체사진 조회 서비스</div>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <div class="hero">
      <div class="car">
        <svg width="37" height="37" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.9"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 17-1 2v1h3v-2m10-1 1 2v1h-3v-2M5 10l2-5h10l2 5M4 10h16v8H4zM4 13h3m10 0h3"/>
        </svg>
      </div>
      <h1>하체사진 조회</h1>
      <p>검사 시 촬영한 자동차 하체사진을<br>
         간편하게 확인하세요.</p>
    </div>

    <label for="plate">차량번호</label>
    <input id="plate" placeholder="예) 123가 4567"
      autocomplete="off" inputmode="text" maxlength="14">
    <button class="primary" id="searchBtn">
      ⌕ &nbsp; 하체사진 조회하기
    </button>
    <div class="note">
      검사 후 조회 가능한 기간 내의 사진이 제공됩니다.
    </div>
  </section>

  <!-- 고객님의 한마디 아이콘 -->
  <section class="card" style="padding:0">
    <a class="feedbackLink" href="feedback.html">
      <div class="feedbackIcon">
        <svg width="27" height="27" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8
          8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9
          L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5
          8.5 8.5 0 0 1 8.7 3.9
          8.4 8.4 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5z"/>
        </svg>
      </div>
      <div class="feedbackText">
        <div class="feedbackTitle">고객님의 한마디</div>
        <div class="feedbackDesc">
          서비스에 대한 소중한 의견을 들려주세요.
        </div>
      </div>
      <span class="chevron">›</span>
    </a>
  </section>

  <section class="card" id="resultCard" aria-live="polite">
    <div class="resultHead">
      <h2>하체사진 조회 결과</h2>
      <span class="pill" id="countPill">조회 결과</span>
    </div>
    <div id="status"></div>
    <div id="viewer" class="hidden">
      <div class="vehicle" id="vehicleLabel"></div>
      <div class="photoFrame">
        <img id="mainPhoto" alt="자동차 하체사진">
        <button class="arrow prev" id="prevBtn">‹</button>
        <button class="arrow next" id="nextBtn">›</button>
      </div>
      <div class="counter" id="counter"></div>
      <div class="thumbs" id="thumbs"></div>
      <button class="secondary" id="saveBtn">
        현재 사진 저장하기
      </button>

      <div class="commentBox hidden" id="commentArea">
        <h3>검사소 점검 소견</h3>
        <div class="commentText" id="commentText"></div>
        <p style="font-size:12px;margin-top:10px">
          검사 당시 확인 가능한 범위의 참고 안내입니다.
        </p>
      </div>

      <button class="secondary" id="backBtn">
        다른 차량 조회하기
      </button>
    </div>
  </section>

  <footer class="page">
    TS 안양자동차검사소 · 자동차 하체사진 조회
  </footer>
</main>

<script>
const SUPABASE_URL =
  'https://qxilydmnxkhcxdybzlew.supabase.co';
const SUPABASE_KEY =
  'sb_publishable_dgOcMAwzSnNozCaHlD6qHg_hXsnNO_t';

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);
const $ = id => document.getElementById(id);

let photosLoaded = [];
let active = 0;
let requestId = 0;

function clearPhotos() {
  photosLoaded.forEach(p => URL.revokeObjectURL(p.url));
  photosLoaded = [];
  $('thumbs').replaceChildren();
  $('viewer').classList.add('hidden');
  $('commentArea').classList.add('hidden');
}

function showStatus(message) {
  $('resultCard').style.display = 'block';
  $('status').textContent = message;
}

function showPhoto(i) {
  if (!photosLoaded.length) return;

  active = (i + photosLoaded.length) % photosLoaded.length;
  const p = photosLoaded[active];

  $('mainPhoto').src = p.url;
  $('mainPhoto').alt = '하체사진 ' + p.order;
  $('counter').textContent =
    `${active + 1} / ${photosLoaded.length}`;

  Array.from($('thumbs').children).forEach((el, n) => {
    el.classList.toggle('active', n === active);
  });

  $('prevBtn').classList.toggle('hidden', photosLoaded.length < 2);
  $('nextBtn').classList.toggle('hidden', photosLoaded.length < 2);
}

$('prevBtn').onclick = () => showPhoto(active - 1);
$('nextBtn').onclick = () => showPhoto(active + 1);

$('backBtn').onclick = () => {
  requestId++;
  clearPhotos();
  $('resultCard').style.display = 'none';
  $('plate').focus();
  window.scrollTo({top:0,behavior:'smooth'});
};

$('saveBtn').onclick = () => {
  const p = photosLoaded[active];
  if (!p) return;

  const ext = p.type === 'image/png' ? 'png' :
    p.type === 'image/webp' ? 'webp' : 'jpg';

  const a = document.createElement('a');
  a.href = p.url;
  a.download = `${p.plate}_하체사진_${p.order}.${ext}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
};

$('searchBtn').onclick = async () => {
  const plate = $('plate').value.replace(/\s/g, '').trim();
  const req = ++requestId;
  clearPhotos();

  if (!/^\d{2,3}[가-힣]\d{4}$/.test(plate)) {
    showStatus('올바른 차량번호를 입력해 주세요.');
    return;
  }

  $('searchBtn').disabled = true;
  showStatus('하체사진을 조회하고 있습니다...');
  $('countPill').textContent = '조회 중';

  try {
    const {data:vehicles,error:ve} = await db
      .from('vehicles')
      .select('id,created_at,inspection_comment')
      .eq('plate_number',plate)
      .gt('expires_at',new Date().toISOString())
      .order('created_at',{ascending:false})
      .limit(1);

    if (ve) throw ve;

    if (!vehicles?.length) {
      showStatus('조회 가능한 사진이 없습니다.');
      return;
    }

    const vehicle = vehicles[0];

    const {data:photos,error:pe} = await db
      .from('vehicle_photos')
      .select('storage_path,photo_order')
      .eq('vehicle_id',vehicle.id)
      .order('photo_order',{ascending:true});

    if (pe) throw pe;

    if (!photos?.length) {
      showStatus('등록된 사진이 없습니다.');
      return;
    }

    for (const photo of photos) {
      const {data,error} = await db.storage
        .from('underbody-photos')
        .download(photo.storage_path);

      if (req !== requestId) return;

      if (error) {
        console.error(error);
        continue;
      }

      photosLoaded.push({
        url:URL.createObjectURL(data),
        type:data.type,
        order:photo.photo_order,
        plate
      });
    }

    if (!photosLoaded.length) {
      showStatus('사진을 불러오지 못했습니다.');
      return;
    }

    $('status').textContent = '';
    $('vehicleLabel').textContent = `차량번호  ${plate}`;
    $('countPill').textContent = `총 ${photosLoaded.length}장`;

    for (let i=0;i<photosLoaded.length;i++) {
      const btn = document.createElement('button');
      btn.className = 'thumb';
      btn.setAttribute('aria-label',`사진 ${i+1} 보기`);

      const img = document.createElement('img');
      img.src = photosLoaded[i].url;
      img.alt = `사진 ${i+1} 미리보기`;
      btn.appendChild(img);

      btn.onclick = () => showPhoto(i);
      $('thumbs').appendChild(btn);
    }

    const comment = (vehicle.inspection_comment || '').trim();
    $('commentText').textContent = comment;
    $('commentArea').classList.toggle('hidden', !comment);

    $('viewer').classList.remove('hidden');
    showPhoto(0);

  } catch(e) {
    showStatus('조회 오류: ' + e.message);
  } finally {
    if (req === requestId) $('searchBtn').disabled = false;
  }
};

$('plate').addEventListener('keydown',e => {
  if (e.key === 'Enter') $('searchBtn').click();
});
</script>
</body>
</html>
