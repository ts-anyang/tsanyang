
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TS 안양자동차검사소 | 하체사진 조회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f5f7fb;
  color: #1c3049;
  font-family: system-ui, 'Malgun Gothic', sans-serif;
}
header {
  background: white;
  border-bottom: 1px solid #dfe7f0;
  padding: 20px;
  text-align: center;
  color: #0759ba;
  font-weight: 800;
}
main {
  max-width: 560px;
  margin: 24px auto;
  padding: 0 14px;
}
.card {
  background: white;
  border: 1px solid #e1e7ef;
  border-radius: 15px;
  padding: 22px;
  margin-bottom: 15px;
}
h1 { font-size: 23px; }
h2 { font-size: 18px; }
label {
  display: block;
  font-weight: 700;
  margin: 14px 0 7px;
}
input, textarea {
  width: 100%;
  border: 1px solid #c9d4e2;
  border-radius: 9px;
  padding: 13px;
  font: inherit;
}
textarea {
  resize: vertical;
  min-height: 95px;
}
button {
  border: 0;
  border-radius: 9px;
  padding: 13px;
  background: #0759ba;
  color: white;
  font-weight: 700;
  cursor: pointer;
  margin-top: 12px;
}
button:disabled { opacity: .5; }
.full { width: 100%; }
.secondary {
  background: #eaf2ff;
  color: #0759ba;
}
.hidden { display: none !important; }
.muted {
  color: #65758b;
  font-size: 13px;
  line-height: 1.6;
}
.status {
  white-space: pre-wrap;
  line-height: 1.6;
  font-size: 14px;
}
.photo {
  position: relative;
  background: #e9eef5;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 4 / 3;
  display: flex;
  align-items: center;
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.photo button {
  position: absolute;
  top: 45%;
  background: #ffffffe0;
  color: #0759ba;
  font-size: 23px;
}
.prev { left: 8px; }
.next { right: 8px; }
.thumbs {
  display: flex;
  gap: 8px;
  overflow: auto;
}
.thumbs button {
  padding: 2px;
  background: #e6edf7;
  flex: 0 0 65px;
  height: 55px;
}
.thumbs button.active {
  outline: 2px solid #0759ba;
}
.thumbs img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.comment {
  background: #f3f7fd;
  padding: 15px;
  border-radius: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<header>
  TS 한국교통안전공단 · 안양자동차검사소
</header>

<main>
  <section class="card">
    <h1>하체사진 조회</h1>
    <p class="muted">
      검사 시 촬영한 자동차 하체사진을 확인하세요.
    </p>

    <label for="plate">차량번호</label>
    <input
      id="plate"
      placeholder="예) 123가4567"
      maxlength="14"
      autocomplete="off"
    >

    <button class="full" id="search">
      하체사진 조회하기
    </button>
  </section>

  <section class="card hidden" id="result">
    <h2>하체사진 조회 결과</h2>
    <div class="status" id="status"></div>

    <div id="viewer" class="hidden">
      <p id="vehicle"></p>

      <div class="photo">
        <img id="mainPhoto" alt="하체사진">
        <button class="prev" id="prev">‹</button>
        <button class="next" id="next">›</button>
      </div>

      <p class="muted" id="counter"></p>
      <div class="thumbs" id="thumbs"></div>

      <button class="full secondary" id="save">
        현재 사진 저장하기
      </button>

      <section id="commentArea" class="hidden">
        <h2>검사소 점검 소견</h2>
        <div class="comment" id="comment"></div>
        <p class="muted">
          검사 당시 확인 가능한 범위의 참고 안내이며,
          정밀 진단을 대신하지 않습니다.
        </p>
      </section>

      <hr>

      <h2>고객님의 한마디</h2>
      <p class="muted">
        서비스 이용 소감이나 개선 의견을 남겨주세요.
        다른 고객에게 공개되지 않습니다.
        이름과 전화번호 등 개인정보는 입력하지 마세요.
      </p>

      <textarea
        id="feedback"
        maxlength="500"
        placeholder="고객님의 의견을 작성해주세요."
      ></textarea>

      <button class="full" id="submit">
        의견 보내기
      </button>

      <p class="status" id="feedbackStatus"></p>

      <button class="full secondary" id="back">
        다른 차량 조회하기
      </button>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL =
  'https://qxilydmnxkhcxdybzlew.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_dgOcMAwzSnNozCaHlD6qHg_hXsnNO_t';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

const clean = s => s.replace(/\s/g, '').trim();
const valid = s => /^\d{2,3}[가-힣]\d{4}$/.test(s);

let loaded = [];
let active = 0;
let request = 0;
let vehicleId = null;

function clearPhotos() {
  for (const p of loaded) {
    URL.revokeObjectURL(p.url);
  }

  loaded = [];
  vehicleId = null;

  $('thumbs').replaceChildren();
  $('viewer').classList.add('hidden');
  $('commentArea').classList.add('hidden');
  $('feedback').value = '';
  $('feedbackStatus').textContent = '';
}

function showPhoto(i) {
  if (!loaded.length) return;

  active = (i + loaded.length) % loaded.length;

  const p = loaded[active];

  $('mainPhoto').src = p.url;
  $('counter').textContent =
    `${active + 1} / ${loaded.length}`;

  [...$('thumbs').children].forEach((b, n) => {
    b.classList.toggle('active', n === active);
  });

  $('prev').classList.toggle(
    'hidden',
    loaded.length < 2
  );

  $('next').classList.toggle(
    'hidden',
    loaded.length < 2
  );
}

$('prev').onclick = () => showPhoto(active - 1);
$('next').onclick = () => showPhoto(active + 1);

$('back').onclick = () => {
  request++;
  clearPhotos();

  $('result').classList.add('hidden');
  $('plate').focus();
};

$('save').onclick = () => {
  if (!loaded.length) return;

  const p = loaded[active];

  const ext =
    p.type === 'image/png' ? 'png' :
    p.type === 'image/webp' ? 'webp' : 'jpg';

  const a = document.createElement('a');

  a.href = p.url;
  a.download =
    `${p.plate}_하체사진_${p.order}.${ext}`;

  document.body.appendChild(a);
  a.click();
  a.remove();
};

$('search').onclick = async () => {
  const plate = clean($('plate').value);
  const req = ++request;

  clearPhotos();

  $('result').classList.remove('hidden');
  $('status').textContent = '조회 중...';

  if (!valid(plate)) {
    $('status').textContent =
      '차량번호를 확인해 주세요.';
    return;
  }

  $('search').disabled = true;

  try {
    // 조회 가능한 기간의 최신 차량 등록 건 검색
    const { data: vehicles, error: ve } =
      await db
        .from('vehicles')
        .select('id,inspection_comment,created_at')
        .eq('plate_number', plate)
        .gt('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false })
        .limit(1);

    if (ve) throw ve;
    if (req !== request) return;

    if (!vehicles?.length) {
      $('status').textContent =
        '조회 가능한 사진이 없습니다. ' +
        '차량번호 또는 조회 가능 기간을 확인해 주세요.';
      return;
    }

    vehicleId = vehicles[0].id;

    // 해당 차량의 사진 목록 조회
    const { data: photos, error: pe } =
      await db
        .from('vehicle_photos')
        .select('storage_path,photo_order')
        .eq('vehicle_id', vehicleId)
        .order('photo_order', { ascending: true });

    if (pe) throw pe;

    if (!photos?.length) {
      $('status').textContent =
        '등록된 사진이 없습니다.';
      return;
    }

    let failed = 0;

    for (const photo of photos) {
      const { data, error } =
        await db.storage
          .from('underbody-photos')
          .download(photo.storage_path);

      if (req !== request) return;

      if (error) {
        console.error('사진 다운로드 오류:', error);
        failed++;
        continue;
      }

      loaded.push({
        url: URL.createObjectURL(data),
        type: data.type,
        order: photo.photo_order,
        plate
      });
    }

    if (!loaded.length) {
      $('status').textContent =
        '사진 다운로드에 실패했습니다. ' +
        '저장소 접근 권한을 확인해야 합니다.';
      return;
    }

    $('status').textContent =
      failed > 0 ?
      `${failed}장의 사진을 불러오지 못했습니다.` :
      '';

    $('vehicle').textContent =
      '차량번호 ' + plate;

    // 사진 미리보기 생성
    loaded.forEach((p, i) => {
      const b = document.createElement('button');
      const img = document.createElement('img');

      img.src = p.url;
      img.alt = `사진 ${i + 1}`;

      b.append(img);
      b.onclick = () => showPhoto(i);

      $('thumbs').append(b);
    });

    // 검사소 점검 소견 표시
    const comment =
      (vehicles[0].inspection_comment || '').trim();

    $('comment').textContent = comment;

    $('commentArea').classList.toggle(
      'hidden',
      !comment
    );

    $('viewer').classList.remove('hidden');

    showPhoto(0);

  } catch (e) {
    console.error('조회 오류:', e);
    $('status').textContent =
      '조회 오류: ' + e.message;

  } finally {
    if (req === request) {
      $('search').disabled = false;
    }
  }
};

$('plate').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    $('search').click();
  }
});

// 고객님의 한마디 제출
$('submit').onclick = async () => {
  const message = $('feedback').value.trim();

  if (!vehicleId) return;

  if (!message || message.length > 500) {
    $('feedbackStatus').textContent =
      '의견을 1~500자로 입력해 주세요.';
    return;
  }

  $('submit').disabled = true;

  try {
    const { error } = await db
      .from('customer_feedback')
      .insert({
        vehicle_id: vehicleId,
        message
      });

    if (error) throw error;

    $('feedback').value = '';

    $('feedbackStatus').textContent =
      '소중한 의견이 접수되었습니다. 감사합니다.';

  } catch (e) {
    console.error('의견 제출 오류:', e);

    $('feedbackStatus').textContent =
      '의견 접수 실패: ' + e.message;

  } finally {
    $('submit').disabled = false;
  }
};
</script>
</body>
</html>
