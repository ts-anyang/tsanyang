
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TS 안양자동차검사소 | 하체사진 조회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --blue:#0867c8;
  --dark:#17283e;
  --muted:#69798c;
  --line:#e5eaf0;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:#f5f7fa;
  color:var(--dark);
  font-family:system-ui,"Malgun Gothic",sans-serif;
}
header {
  background:#fff;
  border-bottom:1px solid var(--line);
}
.top {
  max-width:520px;
  margin:auto;
  padding:17px 19px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand {
  display:flex;
  gap:9px;
  align-items:center;
}
.logo {
  font-size:28px;
  font-weight:900;
  letter-spacing:-3px;
  color:#0874c9;
}
.logo:first-letter {color:#ed931f}
.brandName {font-size:14px;font-weight:800}
.menuIcon {
  font-size:24px;
  color:#26384f;
  text-decoration:none;
}
main {
  max-width:520px;
  margin:25px auto;
  padding:0 16px;
}
.card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:23px 20px;
  margin-bottom:15px;
  box-shadow:0 5px 22px #20385b08;
}
.hero {
  text-align:center;
  padding:17px 0 28px;
}
.carIcon {
  width:70px;
  height:70px;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  color:var(--blue);
}
h1 {
  font-size:25px;
  letter-spacing:-.7px;
  margin:0 0 12px;
}
.description {
  font-size:14px;
  line-height:1.7;
  color:var(--muted);
}
label {
  display:block;
  font-size:14px;
  font-weight:750;
  margin-bottom:10px;
}
input {
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:8px;
  padding:16px;
  font-size:16px;
  outline:none;
}
input:focus {border-color:var(--blue)}
button {cursor:pointer;font:inherit}
button:disabled {opacity:.55}
.primary {
  width:100%;
  border:0;
  background:linear-gradient(110deg,#075bbf,#086bd4);
  color:white;
  border-radius:8px;
  padding:16px;
  font-size:16px;
  font-weight:800;
  margin-top:12px;
}
.notice {
  display:flex;
  align-items:flex-start;
  gap:8px;
  color:#66798d;
  font-size:12px;
  line-height:1.6;
  margin-top:21px;
}
.noticeIcon {
  color:var(--blue);
  font-weight:800;
  font-size:16px;
}
.feedbackLink {
  display:flex;
  gap:13px;
  align-items:center;
  padding:18px 20px;
  color:var(--dark);
  text-decoration:none;
}
.feedbackIcon {
  width:47px;
  height:47px;
  border-radius:13px;
  background:#edf5ff;
  color:var(--blue);
  display:grid;
  place-items:center;
  font-size:25px;
}
.feedbackCopy {flex:1}
.feedbackTitle {font-size:15px;font-weight:800}
.feedbackSub {
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.chevron {font-size:25px;color:#8b9bb0}
.hidden {display:none!important}
#resultCard {display:none}
.resultHeader {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.resultHeader h2 {font-size:18px;margin:0}
.pill {
  background:#eaf3ff;
  color:#0759ba;
  border-radius:20px;
  padding:6px 10px;
  font-size:12px;
  font-weight:750;
}
#status {
  font-size:14px;
  color:var(--muted);
  line-height:1.6;
  white-space:pre-wrap;
}
.vehicleInfo {
  padding:14px 0;
  border-bottom:1px solid var(--line);
  font-weight:750;
  font-size:16px;
}
.sectionTitle {
  font-size:15px;
  font-weight:800;
  margin:20px 0 12px;
}
.photoFrame {
  position:relative;
  background:#e9edf3;
  aspect-ratio:4/3;
  border-radius:11px;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}
.photoFrame img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.arrow {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:#1b2b3ed9;
  color:white;
  font-size:24px;
}
.prev {left:8px}
.next {right:8px}
.counter {
  text-align:right;
  margin:8px 0;
  font-size:12px;
  color:var(--muted);
}
.thumbs {
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:3px 2px 10px;
}
.thumb {
  flex:0 0 65px;
  width:65px;
  height:55px;
  padding:0;
  background:#edf1f6;
  border:2px solid transparent;
  border-radius:7px;
  overflow:hidden;
}
.thumb.active {border-color:var(--blue)}
.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.secondary {
  display:block;
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#edf4fc;
  color:#0759ba;
  font-size:14px;
  font-weight:750;
  margin-top:13px;
}
.commentBox {
  margin-top:22px;
  padding:16px;
  background:#f3f7fd;
  border-radius:10px;
  border:1px solid #e1ebf7;
}
.commentBox h3 {
  margin:0 0 10px;
  font-size:16px;
}
.commentText {
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
footer {
  text-align:center;
  color:#8a97a7;
  font-size:11px;
  margin:26px 0;
}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">
      <div class="logo">TS</div>
      <div class="brandName">안양자동차검사소</div>
    </div>
    <a class="menuIcon" href="feedback.html"
       aria-label="고객님의 한마디">☰</a>
  </div>
</header>

<main>

<section class="card">
  <div class="hero">
    <div class="carIcon">
      <svg width="56" height="56" viewBox="0 0 24 24"
        fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M5 17l-1 2v1h3v-2m10-1 1 2v1h-3v-2"/>
        <path d="M5 10l2-5h10l2 5M4 10h16v8H4z"/>
        <path d="M4 13h3m10 0h3"/>
      </svg>
    </div>

    <h1>하체사진 조회</h1>
    <p class="description">
      검사 시 촬영한 차량 하체사진을<br>
      간편하게 확인하세요.
    </p>
  </div>

  <label for="plate">차량번호</label>
  <input id="plate"
    placeholder="예) 123가 4567"
    autocomplete="off"
    maxlength="14">

  <button class="primary" id="searchBtn">
    ⌕ &nbsp; 조회하기
  </button>

  <div class="notice">
    <span class="noticeIcon">ⓘ</span>
    <span>
      검사 후 조회 가능한 하체사진을 제공합니다.<br>
      차량번호 입력 시 최근 검사 사진이 표시됩니다.
    </span>
  </div>
</section>

<!-- 고객님의 한마디: 독립된 페이지로 이동 -->
<section class="card" style="padding:0">
  <a class="feedbackLink" href="feedback.html">
    <div class="feedbackIcon">
      <svg width="27" height="27" viewBox="0 0 24 24"
        fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5
          8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7
          A8.5 8.5 0 1 1 21 11.5z"/>
        <path d="M8 12h8M8 15h5"/>
      </svg>
    </div>
    <div class="feedbackCopy">
      <div class="feedbackTitle">고객님의 한마디</div>
      <div class="feedbackSub">
        서비스에 대한 소중한 의견을 들려주세요.
      </div>
    </div>
    <span class="chevron">›</span>
  </a>
</section>

<section class="card" id="resultCard">
  <div class="resultHeader">
    <h2>하체사진 조회 결과</h2>
    <span class="pill" id="countPill">조회 결과</span>
  </div>

  <div id="status" aria-live="polite"></div>

  <div id="viewer" class="hidden">
    <div class="vehicleInfo" id="vehicleLabel"></div>

    <div class="sectionTitle">하체사진</div>

    <div class="photoFrame">
      <img id="mainPhoto" alt="자동차 하체사진">
      <button class="arrow prev" id="prevBtn"
        aria-label="이전 사진">‹</button>
      <button class="arrow next" id="nextBtn"
        aria-label="다음 사진">›</button>
    </div>

    <div class="counter" id="counter"></div>
    <div class="thumbs" id="thumbs"></div>

    <button class="secondary" id="saveBtn">
      현재 사진 저장하기
    </button>

    <div class="commentBox hidden" id="commentArea">
      <h3>검사소 점검 소견</h3>
      <div class="commentText" id="commentText"></div>
      <p class="description" style="font-size:12px;margin-top:10px">
        검사 당시 확인 가능한 범위의 참고 안내입니다.
      </p>
    </div>

    <button class="secondary" id="backBtn">
      ☷ &nbsp; 목록으로 돌아가기
    </button>
  </div>
</section>

<footer>
  TS 안양자동차검사소 · 하체사진 조회 서비스
</footer>

</main>

<script>
const SUPABASE_URL =
  'https://qxilydmnxkhcxdybzlew.supabase.co';
const SUPABASE_KEY =
  'sb_publishable_dgOcMAwzSnNozCaHlD6qHg_hXsnNO_t';

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let photosLoaded = [];
let active = 0;
let requestId = 0;

function clearPhotos() {
  photosLoaded.forEach(p => URL.revokeObjectURL(p.url));
  photosLoaded = [];
  $('thumbs').replaceChildren();
  $('viewer').classList.add('hidden');
  $('commentArea').classList.add('hidden');
}

function showStatus(message) {
  $('resultCard').style.display = 'block';
  $('status').textContent = message;
}

function showPhoto(i) {
  if (!photosLoaded.length) return;

  active = (i + photosLoaded.length) % photosLoaded.length;
  const p = photosLoaded[active];

  $('mainPhoto').src = p.url;
  $('mainPhoto').alt = '하체사진 ' + p.order;
  $('counter').textContent =
    `${active + 1} / ${photosLoaded.length}`;

  Array.from($('thumbs').children).forEach((el, n) => {
    el.classList.toggle('active', n === active);
  });

  $('prevBtn').classList.toggle(
    'hidden', photosLoaded.length < 2
  );
  $('nextBtn').classList.toggle(
    'hidden', photosLoaded.length < 2
  );
}

$('prevBtn').onclick = () => showPhoto(active - 1);
$('nextBtn').onclick = () => showPhoto(active + 1);

$('backBtn').onclick = () => {
  requestId++;
  clearPhotos();
  $('resultCard').style.display = 'none';
  $('plate').focus();
  window.scrollTo({top:0,behavior:'smooth'});
};

$('saveBtn').onclick = () => {
  const p = photosLoaded[active];
  if (!p) return;

  const ext = p.type === 'image/png' ? 'png' :
    p.type === 'image/webp' ? 'webp' : 'jpg';

  const a = document.createElement('a');
  a.href = p.url;
  a.download = `${p.plate}_하체사진_${p.order}.${ext}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
};

$('searchBtn').onclick = async () => {
  const plate = $('plate').value.replace(/\s/g, '').trim();
  const req = ++requestId;
  clearPhotos();

  if (!/^\d{2,3}[가-힣]\d{4}$/.test(plate)) {
    showStatus('올바른 차량번호를 입력해 주세요.');
    return;
  }

  $('searchBtn').disabled = true;
  showStatus('하체사진을 조회하고 있습니다...');
  $('countPill').textContent = '조회 중';

  try {
    const {data:vehicles,error:ve} = await db
      .from('vehicles')
      .select('id,created_at,inspection_comment')
      .eq('plate_number',plate)
      .gt('expires_at',new Date().toISOString())
      .order('created_at',{ascending:false})
      .limit(1);

    if (ve) throw ve;
    if (req !== requestId) return;

    if (!vehicles?.length) {
      showStatus('조회 가능한 사진이 없습니다.');
      return;
    }

    const vehicle = vehicles[0];

    const {data:photos,error:pe} = await db
      .from('vehicle_photos')
      .select('storage_path,photo_order')
      .eq('vehicle_id',vehicle.id)
      .order('photo_order',{ascending:true});

    if (pe) throw pe;

    if (!photos?.length) {
      showStatus('등록된 사진이 없습니다.');
      return;
    }

    for (const photo of photos) {
      const {data,error} = await db.storage
        .from('underbody-photos')
        .download(photo.storage_path);

      if (req !== requestId) return;

      if (error) {
        console.error(error);
        continue;
      }

      photosLoaded.push({
        url:URL.createObjectURL(data),
        type:data.type,
        order:photo.photo_order,
        plate
      });
    }

    if (!photosLoaded.length) {
      showStatus('사진을 불러오지 못했습니다.');
      return;
    }

    $('status').textContent = '';
    $('vehicleLabel').textContent =
      '차량번호  ' + plate;
    $('countPill').textContent =
      `총 ${photosLoaded.length}장`;

    for (let i=0;i<photosLoaded.length;i++) {
      const btn = document.createElement('button');
      btn.className = 'thumb';
      btn.setAttribute('aria-label',`사진 ${i+1} 보기`);

      const img = document.createElement('img');
      img.src = photosLoaded[i].url;
      img.alt = `사진 ${i+1} 미리보기`;
      btn.appendChild(img);
      btn.onclick = () => showPhoto(i);
      $('thumbs').appendChild(btn);
    }

    const comment =
      (vehicle.inspection_comment || '').trim();

    $('commentText').textContent = comment;
    $('commentArea').classList.toggle(
      'hidden', !comment
    );

    $('viewer').classList.remove('hidden');
    showPhoto(0);

  } catch(e) {
    showStatus('조회 오류: ' + e.message);
  } finally {
    if (req === requestId) {
      $('searchBtn').disabled = false;
    }
  }
};

$('plate').addEventListener('keydown',e => {
  if (e.key === 'Enter') $('searchBtn').click();
});
</script>
</body>
</html>
