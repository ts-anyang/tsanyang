
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>TS 안양자동차검사소 | 하체사진 조회</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --blue:#075cc6;
  --blue2:#0788ef;
  --navy:#111e3b;
  --gray:#5f697a;
  --line:#d8e0eb;
}
* {box-sizing:border-box}

body {
  margin:0;
  background:#f4f6fa;
  color:var(--navy);
  font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input {font:inherit}
button {cursor:pointer}
button:disabled {opacity:.55;cursor:wait}

.app {
  position:relative;
  max-width:430px;
  min-height:100svh;
  margin:0 auto;
  background:#fff;
  overflow:hidden;
  box-shadow:0 0 24px #162f5110;
}

/* 시안 03 배경 곡선 */
.decorTop,.decorBottom {
  position:absolute;
  pointer-events:none;
  width:100%;
  z-index:0;
}
.decorTop {
  top:0;
  right:0;
  height:140px;
}
.decorBottom {
  bottom:0;
  left:0;
  height:95px;
}

.screen {
  position:relative;
  z-index:1;
  min-height:100svh;
  padding:72px 24px 86px;
  display:flex;
  flex-direction:column;
}
.hidden {display:none!important}

/* TS 로고 */
.brand {
  display:flex;
  align-items:center;
  gap:8px;
  min-height:45px;
}
.ts-mark {
  width:74px;
  height:48px;
  flex-shrink:0;
}
.brand-text {
  font-size:15px;
  line-height:1.43;
  font-weight:850;
  letter-spacing:-.5px;
}

/* 중앙 하체사진 조회 */
.hero {
  text-align:center;
  margin-top:67px;
}
.car-circle {
  width:82px;
  height:82px;
  border-radius:50%;
  background:linear-gradient(140deg,#eef7ff,#d7eafd);
  display:grid;
  place-items:center;
  margin:0 auto 19px;
}
.car-circle svg {
  width:50px;
  height:50px;
  color:var(--blue);
}
h1 {
  font-size:28px;
  font-weight:850;
  letter-spacing:-1.3px;
  margin:0 0 14px;
}
.hero p {
  font-size:15px;
  line-height:1.65;
  color:#465168;
  margin:0;
  word-break:keep-all;
}

/* 차량번호 조회 */
.lookup {margin-top:38px}
.lookup label {
  display:block;
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
}
.lookup input {
  height:55px;
  width:100%;
  border:1.3px solid #ced6e2;
  border-radius:11px;
  padding:0 16px;
  font-size:16px;
  color:var(--navy);
  outline:none;
  background:#fff;
}
.lookup input::placeholder {color:#9da7b5}
.lookup input:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px #006bd411;
}
.primary {
  width:100%;
  height:56px;
  border:0;
  border-radius:11px;
  background:linear-gradient(110deg,#078bed 0%,#0853bf 100%);
  color:#fff;
  font-size:17px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-top:16px;
  box-shadow:0 4px 12px #075ac019;
}
.primary svg {
  width:21px;
  height:21px;
}

/* 고객님의 한마디 */
.feedback {
  display:flex;
  align-items:center;
  gap:13px;
  margin-top:21px;
  min-height:64px;
  padding:0 19px;
  border:1px solid #dce3ed;
  border-radius:12px;
  background:#fff;
  color:var(--navy);
  text-decoration:none;
  box-shadow:0 4px 12px #19284306;
}
.feedback svg {
  color:#086acc;
  width:27px;
  height:27px;
  flex:0 0 auto;
}
.feedback strong {
  flex:1;
  font-size:16px;
  font-weight:800;
}
.feedback .chevron {
  font-size:25px;
  color:#0e1c37;
  font-weight:600;
}
.footer {
  text-align:center;
  color:#8e98a8;
  font-size:11px;
  margin-top:auto;
  padding-top:28px;
}
.status {
  font-size:13px;
  color:#526580;
  line-height:1.6;
  white-space:pre-line;
  margin:12px 0 0;
}

/* 조회 결과 */
#resultScreen {padding-top:81px}

.result-head {
  display:flex;
  align-items:center;
  margin-bottom:27px;
  min-height:34px;
}
.back {
  border:0;
  background:none;
  padding:0;
  width:32px;
  flex:0 0 32px;
  color:var(--navy);
  font-size:31px;
  line-height:1;
}
.result-head h2 {
  flex:1;
  text-align:center;
  font-size:23px;
  letter-spacing:-.8px;
  margin:0 32px 0 0;
  font-weight:850;
}

/* 차량번호 카드 */
.vehicle-card {
  display:flex;
  gap:16px;
  align-items:center;
  justify-content:center;
  min-height:62px;
  padding:14px;
  border:1px solid #d9e3f1;
  border-radius:13px;
  background:linear-gradient(100deg,#f8fbff,#edf6ff);
  margin-bottom:18px;
}
.vehicle-card svg {
  width:29px;
  height:29px;
  color:var(--blue);
}
.vehicle-divider {
  height:25px;
  width:1px;
  background:#afc0d3;
}
#vehicleLabel {
  font-size:20px;
  font-weight:850;
  letter-spacing:-.5px;
}

/* 사진 슬라이드 */
.photo {
  position:relative;
  width:100%;
  aspect-ratio:1.5/1;
  background:#e7edf3;
  border-radius:13px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.photo img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.arrow {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#ffffffeb;
  color:var(--navy);
  font-size:27px;
  box-shadow:0 1px 7px #0002;
}
.prev {left:9px}
.next {right:9px}

.thumbs {
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:4px 1px 5px;
  margin:9px 0 1px;
}
.thumb {
  width:67px;
  height:57px;
  flex:0 0 67px;
  border:2px solid transparent;
  border-radius:9px;
  padding:0;
  overflow:hidden;
  background:#e9eef4;
}
.thumb.active {
  border-color:#0872e1;
  box-shadow:0 0 0 1px #0872e1;
}
.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
}
#counter {
  text-align:right;
  font-size:12px;
  color:#78869a;
  margin:8px 0 0;
}
#saveBtn {margin-top:16px}

/* 검사소 점검 소견 */
.comment-card {
  margin-top:19px;
  border:1px solid #dce3ed;
  border-radius:13px;
  padding:16px 17px;
  background:#fff;
  box-shadow:0 4px 12px #122d5308;
}
.comment-head {
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:850;
  font-size:16px;
  margin-bottom:12px;
}
.comment-head svg {
  color:#056bd2;
  width:23px;
  height:23px;
}
.comment-text {
  font-size:14px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  color:#37435a;
}
.comment-note {
  color:#7b8798;
  font-size:11px;
  line-height:1.5;
  margin-top:10px;
}
#resultScreen .feedback {margin-top:18px}

/* 모바일 높이 대응 */
@media(max-height:740px) {
  .screen {padding-top:42px;padding-bottom:76px}
  .hero {margin-top:39px}
  .lookup {margin-top:25px}
  #resultScreen {padding-top:48px}
}
@media(max-width:360px) {
  .screen {padding-left:18px;padding-right:18px}
  .brand-text {font-size:13px}
  .hero {margin-top:49px}
  .lookup {margin-top:29px}
  .result-head h2 {font-size:20px}
}
</style>
</head>

<script>
const SUPABASE_URL =
  'https://qxilydmnxkhcxdybzlew.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_dgOcMAwzSnNozCaHlD6qHg_hXsnNO_t';

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let photosLoaded = [];
let active = 0;
let requestId = 0;

function clearPhotos() {
  photosLoaded.forEach(p => URL.revokeObjectURL(p.url));

  photosLoaded = [];
  active = 0;

  $('thumbs').replaceChildren();
  $('viewer').classList.add('hidden');
  $('commentArea').classList.add('hidden');
  $('mainPhoto').removeAttribute('src');
}

function showPhoto(i) {
  if (!photosLoaded.length) return;

  active = (i + photosLoaded.length) % photosLoaded.length;

  const p = photosLoaded[active];

  $('mainPhoto').src = p.url;
  $('mainPhoto').alt = '하체사진 ' + p.order;

  $('counter').textContent =
    (active + 1) + ' / ' + photosLoaded.length;

  [...$('thumbs').children].forEach((btn,n) => {
    btn.classList.toggle('active', n === active);
    btn.setAttribute('aria-pressed', String(n === active));
  });

  $('prevBtn').classList.toggle(
    'hidden', photosLoaded.length < 2
  );
  $('nextBtn').classList.toggle(
    'hidden', photosLoaded.length < 2
  );
}

$('prevBtn').onclick = () => showPhoto(active - 1);
$('nextBtn').onclick = () => showPhoto(active + 1);

$('backBtn').onclick = () => {
  requestId++;
  clearPhotos();

  $('resultScreen').classList.add('hidden');
  $('searchScreen').classList.remove('hidden');
  $('searchBtn').disabled = false;
  $('searchStatus').textContent = '';

  $('plate').focus();
  scrollTo(0,0);
};

$('saveBtn').onclick = () => {
  const p = photosLoaded[active];
  if (!p) return;

  const ext =
    p.type === 'image/png' ? 'png' :
    p.type === 'image/webp' ? 'webp' : 'jpg';

  const a = document.createElement('a');
  a.href = p.url;
  a.download = `${p.plate}_하체사진_${p.order}.${ext}`;

  document.body.appendChild(a);
  a.click();
  a.remove();
};

$('searchBtn').onclick = async () => {
  const plate = $('plate').value.replace(/\s/g,'').trim();

  if (!/^\d{2,3}[가-힣]\d{4}$/.test(plate)) {
    $('searchStatus').textContent =
      '올바른 차량번호를 입력해 주세요.';
    return;
  }

  const req = ++requestId;

  clearPhotos();

  $('searchBtn').disabled = true;
  $('searchStatus').textContent = '조회 중...';
  $('vehicleLabel').textContent = plate;

  $('searchScreen').classList.add('hidden');
  $('resultScreen').classList.remove('hidden');
  $('resultStatus').textContent =
    '하체사진을 불러오고 있습니다...';

  scrollTo(0,0);

  try {
    const {data:vehicles,error:ve} = await db
      .from('vehicles')
      .select('id,created_at,inspection_comment')
      .eq('plate_number',plate)
      .gt('expires_at',new Date().toISOString())
      .order('created_at',{ascending:false})
      .limit(1);

    if (ve) throw ve;
    if (req !== requestId) return;

    if (!vehicles?.length) {
      $('resultStatus').textContent =
        '조회 가능한 사진이 없습니다.\n' +
        '차량번호와 조회 가능 기간을 확인해 주세요.';
      return;
    }

    const vehicle = vehicles[0];

    const {data:photos,error:pe} = await db
      .from('vehicle_photos')
      .select('storage_path,photo_order')
      .eq('vehicle_id',vehicle.id)
      .order('photo_order',{ascending:true});

    if (pe) throw pe;
    if (req !== requestId) return;

    if (!photos?.length) {
      $('resultStatus').textContent =
        '등록된 하체사진이 없습니다.';
      return;
    }

    let failed = 0;

    for (const photo of photos) {
      const {data,error} = await db.storage
        .from('underbody-photos')
        .download(photo.storage_path);

      if (req !== requestId) return;

      if (error) {
        console.error('사진 다운로드 실패:',error);
        failed++;
        continue;
      }

      photosLoaded.push({
        url:URL.createObjectURL(data),
        type:data.type,
        order:photo.photo_order,
        plate
      });
    }

    if (!photosLoaded.length) {
      $('resultStatus').textContent =
        '사진을 불러오지 못했습니다.\n' +
        '사진 저장소 접근 권한을 확인해 주세요.';
      return;
    }

    $('resultStatus').textContent = failed
      ? `${failed}장의 사진을 불러오지 못했습니다.`
      : '';

    photosLoaded.forEach((p,i) => {
      const btn = document.createElement('button');
      btn.className = 'thumb';
      btn.type = 'button';
      btn.setAttribute('aria-label',`사진 ${i+1} 보기`);

      const img = document.createElement('img');
      img.src = p.url;
      img.alt = `사진 ${i+1} 미리보기`;

      btn.append(img);
      btn.onclick = () => showPhoto(i);

      $('thumbs').append(btn);
    });

    const comment =
      (vehicle.inspection_comment || '').trim();

    $('commentText').textContent = comment;

    $('commentArea').classList.toggle(
      'hidden', !comment
    );

    $('viewer').classList.remove('hidden');

    showPhoto(0);

  } catch(e) {
    console.error('조회 오류:',e);

    if (req === requestId) {
      $('resultStatus').textContent =
        '조회 오류: ' + e.message;
    }
  } finally {
    if (req === requestId) {
      $('searchBtn').disabled = false;
      $('searchStatus').textContent = '';
    }
  }
};

$('plate').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    $('searchBtn').click();
  }
});
</script>
